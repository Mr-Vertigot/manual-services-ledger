<title>Manual Services Ledger &amp; P&amp;L</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* logic is injected below this line by the build step */
/* shared between server and browser: pure functions only, no React */

const DEFAULT_SETTINGS = {
  currency: "$",
  rateDev: 30,
  ratePm: 25,
  termsDays: 7,
  team: [
    { id: "cas", role: "Project management", name: "Casandra Visser", email: "" },
    { id: "ritvik", role: "Manual audit and VPAT", name: "Ritvik", email: "" },
    { id: "denis", role: "Developer", name: "Denis", email: "" },
  ],
  referralRules: [],   /* { match: "nolan", partner: "Nolan Klein", type: "pct" | "fixed", value: 20 } */
  autoEmails: true,
  lastReconcile: "",
  lastMonday: "",
};

const SERVICE_LABELS = {
  remediation: "Remediation",
  audit: "Manual audit",
  vpat: "VPAT",
  pdf: "PDF remediation",
  monitoring: "Monitoring",
};
const ONE_TIME = ["remediation", "audit", "vpat", "pdf"];
const SHORT = { remediation: "REM", audit: "AUDIT", vpat: "VPAT", pdf: "PDF", monitoring: "MON" };

const uid = () => Math.random().toString(36).slice(2, 10);
const num = (v) => (isNaN(parseFloat(v)) ? 0 : parseFloat(v));
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => today().slice(0, 7);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const monthName = (m) => new Date(m + "-02").toLocaleDateString("en-US", { month: "short", year: "numeric" });

function money(v, cur = "$") {
  const n = num(v);
  const s = Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  return (n < 0 ? "-" : "") + cur + s;
}

function newProject(partial = {}) {
  return {
    id: uid(),
    client: "",
    contractDate: today(),
    closed: false,
    services: { remediation: true, audit: false, vpat: false, pdf: false, monitoring: false },
    projectFee: 0,
    depositPct: 50,
    monitoringMonthly: 0,
    lead: { source: "", partner: "" },
    costs: {
      audit: { amount: 0, paidAt: "", note: "" },
      vpat: { amount: 0, paidAt: "", note: "" },
      pdf: { amount: 0, paidAt: "", note: "" },
      dev: { hours: 0, paidAt: "", note: "" },
      pm: { hours: 0, paidAt: "", note: "" },
      referral: { amount: 0, paidAt: "", note: "" },
      sales: { amount: 0, paidAt: "", note: "" },
    },
    deposit: { paidAt: "", invoiceNo: "", invoicedAt: "" },
    balance: { paidAt: "", invoiceNo: "", invoicedAt: "" },
    deliveredAt: "",
    monitoringLog: [],
    requests: {},
    upsellCall: { bookedAt: "", outcome: "" },
    notes: "",
    ...partial,
  };
}

function monitoringState(p) {
  if (!p.services.monitoring) return "none";
  if (!p.deliveredAt || p.deliveredAt > today()) return "pending";
  return "running";
}

function paymentState(p) {
  const fee = num(p.projectFee);
  const deposit = (fee * num(p.depositPct)) / 100;
  if (!p.deposit.paidAt && deposit > 0) return "awaiting-deposit";
  if (!p.balance.paidAt && fee - deposit > 0) return "balance-remaining";
  return "paid";
}
const STATE_LABEL = { "awaiting-deposit": "Awaiting deposit", "balance-remaining": "Balance remaining", paid: "Paid in full" };

function referralFor(p, s) {
  if (num(p.costs.referral.amount)) return num(p.costs.referral.amount);
  const src = `${p.lead.source} ${p.lead.partner}`.toLowerCase();
  const rule = (s.referralRules || []).find((r) => r.match && src.includes(r.match.toLowerCase()));
  if (!rule) return 0;
  return rule.type === "pct" ? (num(p.projectFee) * num(rule.value)) / 100 : num(rule.value);
}

function pnl(p, s) {
  const c = p.costs;
  const fee = num(p.projectFee);
  const audit = p.services.audit || p.services.remediation ? num(c.audit.amount) : 0;
  const vpat = p.services.vpat ? num(c.vpat.amount) : 0;
  const pdf = p.services.pdf ? num(c.pdf.amount) : 0;
  const dev = num(c.dev.hours) * num(s.rateDev);
  const pm = num(c.pm.hours) * num(s.ratePm);
  const referral = referralFor(p, s);
  const sales = num(c.sales.amount);
  const cost = audit + vpat + pdf + dev + pm + referral + sales;
  const margin = fee - cost;

  const mFee = num(p.monitoringMonthly);
  const log = p.monitoringLog || [];
  const mRevenue = log.length * mFee;
  const mCost = log.reduce((a, e) => a + num(e.hours), 0) * num(s.rateDev);
  const mMargin = mRevenue - mCost;

  const deposit = (fee * num(p.depositPct)) / 100;
  const balance = fee - deposit;
  const collected = (p.deposit.paidAt ? deposit : 0) + (p.balance.paidAt ? balance : 0);
  const state = monitoringState(p);

  return {
    fee, audit, vpat, pdf, dev, pm, referral, sales, cost, margin,
    marginPct: fee ? (margin / fee) * 100 : 0,
    mFee, mRevenue, mCost, mMargin, mMonths: log.length, state,
    mrr: state === "running" ? mFee : 0,
    pendingMrr: state === "pending" ? mFee : 0,
    deposit, balance, collected, outstanding: fee - collected,
  };
}

function tasksFor(p, s) {
  const out = [];
  if (p.closed) return out;
  const n = pnl(p, s);
  const k = (t) => `${p.id}:${t}`;

  if (!p.deposit.paidAt && n.deposit > 0)
    out.push({ key: k("deposit"), level: "amber", title: `Deposit unpaid ${money(n.deposit, s.currency)}`, project: p });

  if (p.deliveredAt && !p.balance.paidAt && n.balance > 0) {
    const inv = p.balance.invoicedAt;
    out.push({
      key: k("balance"),
      level: inv && daysBetween(inv, today()) > s.termsDays ? "red" : "amber",
      title: inv ? `Balance overdue ${money(n.balance, s.currency)}` : `Invoice the balance ${money(n.balance, s.currency)}`,
      project: p,
    });
  }

  if (p.deliveredAt && !p.services.monitoring && !p.upsellCall.bookedAt)
    out.push({ key: k("upsell"), level: "slate", title: "Book the monitoring call", project: p });

  if (monitoringState(p) === "running" && !(p.monitoringLog || []).some((e) => e.month === thisMonth()))
    out.push({ key: k("mon"), level: "green", title: `Log ${monthName(thisMonth())} monitoring hours`, project: p });

  return out;
}

function cashFlow(projects, s) {
  const rows = {};
  const touch = (m) => (rows[m] = rows[m] || { month: m, in: 0, out: 0, lines: [] });
  const add = (date, amt, label, dir) => {
    if (!date || !amt) return;
    const r = touch(date.slice(0, 7));
    r[dir] += amt;
    r.lines.push({ date, amt, label, dir });
  };

  projects.forEach((p) => {
    const n = pnl(p, s);
    const who = p.client || "Untitled";
    add(p.deposit.paidAt, n.deposit, `${who}, deposit`, "in");
    add(p.balance.paidAt, n.balance, `${who}, balance`, "in");
    (p.monitoringLog || []).forEach((e) => add(e.paidAt, n.mFee, `${who}, monitoring ${monthName(e.month)}`, "in"));

    const c = p.costs;
    add(c.audit.paidAt, n.audit, `${who}, audit, Ritvik`, "out");
    add(c.vpat.paidAt, n.vpat, `${who}, VPAT, Ritvik`, "out");
    add(c.pdf.paidAt, n.pdf, `${who}, PDF`, "out");
    add(c.dev.paidAt, n.dev, `${who}, dev, Denis`, "out");
    add(c.pm.paidAt, n.pm, `${who}, PM, Cas`, "out");
    add(c.referral.paidAt, n.referral, `${who}, referral, ${p.lead.partner || "partner"}`, "out");
    add(c.sales.paidAt, n.sales, `${who}, sales fee`, "out");
  });

  return Object.values(rows)
    .map((r) => ({ ...r, net: r.in - r.out, lines: r.lines.sort((a, b) => (a.date < b.date ? -1 : 1)) }))
    .sort((a, b) => (a.month < b.month ? 1 : -1));
}

/* -------------------------------------------------- supplier emails */
const TAG = (p) => `[Ledger ${p.id}]`;

function supplierEmail(kind, p, member, cc) {
  const sold = Object.keys(SERVICE_LABELS).filter((k) => p.services[k]).map((k) => SERVICE_LABELS[k]).join(", ");
  const who = p.client || "the client";
  const first = (member.name || "").split(" ")[0];

  if (kind === "ritvik") {
    return {
      to: member.email,
      cc: cc?.email || "",
      subject: `${who}: audit cost for the P&L ${TAG(p)}`,
      body:
`Hi ${first},

This is an automated email from the manual services P&L Danny built.

New project: ${who}
Sold: ${sold}

For the P&L I need your cost on this one:
- Manual audit: $
${p.services.vpat ? "- VPAT: $\n" : ""}- Re-audit or QA rounds, if any: $

Reply to this email with the numbers, one per line. Nothing else needed.

Thanks`,
    };
  }

  return {
    to: member.email,
    cc: cc?.email || "",
    subject: `${who}: hours for the P&L ${TAG(p)}`,
    body:
`Hi ${first},

This is an automated email from the manual services P&L Danny built.

Project: ${who}
Sold: ${sold}

Reply with:
- Denis dev hours so far: 
- Your project management hours so far: 
${p.services.pdf ? "- PDF remediation cost: $\n" : ""}- Handed over to the client? (yes/no, and the date if yes)

One number per line. Nothing else needed.

Thanks`,
  };
}



/* ------------------------------------------------------------------ tokens */
const C = {
  bg: "#EFF2F1", panel: "#FFFFFF", ink: "#131C19", ink2: "#57635F", ink3: "#8A9490", rule: "#DCE3E0",
  green: "#0B6B53", greenSoft: "#E2F0EB", red: "#A93520", redSoft: "#F8E7E3",
  amber: "#8A6608", amberSoft: "#F7EFDB", slate: "#2B4A5E", slateSoft: "#E6EDF2",
};
const MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace';
const SANS = 'ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif';

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ------------------------------------------------------------------ atoms */
const inputStyle = { fontFamily: SANS, fontSize: 13, color: C.ink, background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 3, padding: "7px 9px", width: "100%", outline: "none" };
const TextIn = (p) => <input {...p} style={{ ...inputStyle, ...(p.style || {}) }} />;
const NumIn = (p) => <input {...p} type="number" style={{ ...inputStyle, fontFamily: MONO, textAlign: "right", ...(p.style || {}) }} />;
const Field = ({ label, children }) => (
  <label className="flex flex-col gap-1">
    <span style={{ fontFamily: MONO, fontSize: 10, letterSpacing: ".08em", textTransform: "uppercase", color: C.ink3 }}>{label}</span>
    {children}
  </label>
);
function Chip({ tone = "slate", children }) {
  const m = { green: [C.greenSoft, C.green], red: [C.redSoft, C.red], amber: [C.amberSoft, C.amber], slate: [C.slateSoft, C.slate] };
  const [bg, fg] = m[tone] || m.slate;
  return <span style={{ background: bg, color: fg, fontFamily: MONO, fontSize: 10, letterSpacing: ".06em", textTransform: "uppercase", padding: "3px 6px", borderRadius: 3, whiteSpace: "nowrap" }}>{children}</span>;
}
function Btn({ kind = "ghost", children, ...rest }) {
  const base = { fontFamily: SANS, fontSize: 12.5, fontWeight: 500, padding: "7px 12px", borderRadius: 3, cursor: "pointer", border: `1px solid ${C.rule}`, background: C.panel, color: C.ink };
  const kinds = { primary: { background: C.ink, color: "#fff", border: `1px solid ${C.ink}` }, good: { background: C.green, color: "#fff", border: `1px solid ${C.green}` }, ghost: {}, danger: { color: C.red } };
  return <button {...rest} style={{ ...base, ...kinds[kind], ...(rest.style || {}) }}>{children}</button>;
}
function Panel({ title, right, children, pad = true }) {
  return (
    <section style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4 }}>
      {title && (
        <header className="flex items-center justify-between" style={{ borderBottom: `1px solid ${C.rule}`, padding: "9px 14px" }}>
          <h2 style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: ".1em", textTransform: "uppercase", color: C.ink2 }}>{title}</h2>
          {right}
        </header>
      )}
      <div style={pad ? { padding: 14 } : undefined}>{children}</div>
    </section>
  );
}
function Row({ label, value, strong, tone, onClick }) {
  return (
    <div onClick={onClick} className="flex items-baseline justify-between gap-4" style={{ padding: "6px 0", borderBottom: `1px solid ${C.rule}`, cursor: onClick ? "pointer" : "default" }}>
      <span style={{ fontSize: 13, color: strong ? C.ink : C.ink2, fontWeight: strong ? 600 : 400 }}>{label}</span>
      <span style={{ fontFamily: MONO, fontSize: 13, fontWeight: strong ? 600 : 400, color: tone === "red" ? C.red : tone === "green" ? C.green : C.ink }}>{value}</span>
    </div>
  );
}
/* one payment line: label, amount, paid toggle with date */
function PayLine({ label, amount, paidAt, onChange, cur, muted, hint }) {
  return (
    <div className="flex items-center justify-between gap-3" style={{ padding: "9px 0", borderBottom: `1px solid ${C.rule}`, opacity: muted ? 0.5 : 1 }}>
      <div>
        <div style={{ fontSize: 13.5, fontWeight: 600 }}>{label}</div>
        {hint && <div style={{ fontSize: 11.5, color: C.ink3 }}>{hint}</div>}
      </div>
      <div className="flex items-center gap-3">
        <span style={{ fontFamily: MONO, fontSize: 13 }}>{money(amount, cur)}</span>
        {onChange && (paidAt
          ? <span className="flex items-center gap-2"><Chip tone="green">paid {paidAt}</Chip><button onClick={() => onChange("")} style={{ background: "none", border: "none", color: C.ink3, cursor: "pointer", fontSize: 12 }}>undo</button></span>
          : <Btn kind="good" onClick={() => onChange(today())}>Mark paid</Btn>)}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ intake */
function Intake({ settings, onCreate }) {
  const [mode, setMode] = useState("contract");
  const [stage, setStage] = useState("idle");
  const [err, setErr] = useState("");
  const [pasted, setPasted] = useState("");
  const [draft, setDraft] = useState(null);
  const fileRef = useRef(null);

  async function parse(file, text) {
    setErr(""); setStage("parsing");
    try {
      const fd = new FormData();
      fd.append("mode", mode);
      if (file) fd.append("file", file);
      if (text) fd.append("text", text);
      const res = await fetch("/api/parse", { method: "POST", body: fd });
      const r = await res.json();
      if (!res.ok) throw new Error(r.error || "Could not read it");
      setDraft(newProject({
        client: r.client || "", contractDate: r.contractDate || today(),
        services: { remediation: false, audit: false, vpat: false, pdf: false, monitoring: false, ...(r.services || {}) },
        projectFee: num(r.projectFee), depositPct: num(r.depositPct) || 50, monitoringMonthly: num(r.monitoringMonthly), notes: r.scopeNotes || "",
      }));
      setStage("review");
    } catch (e) { setErr(e.message); setStage("idle"); }
  }

  if (stage === "review" && draft) {
    const set = (patch) => setDraft({ ...draft, ...patch });
    const ritvik = settings.team.find((t) => t.id === "ritvik");
    const cas = settings.team.find((t) => t.id === "cas");
    return (
      <div className="grid gap-4" style={{ maxWidth: 720 }}>
        <Panel title="What was sold">
          <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <Field label="Client"><TextIn value={draft.client} onChange={(e) => set({ client: e.target.value })} /></Field>
            <Field label="Contract date"><TextIn type="date" value={draft.contractDate} onChange={(e) => set({ contractDate: e.target.value })} /></Field>
          </div>
          <div className="flex flex-wrap gap-2 mt-4">
            {Object.keys(SERVICE_LABELS).map((k) => (
              <button key={k} onClick={() => set({ services: { ...draft.services, [k]: !draft.services[k] } })}
                style={{ fontFamily: SANS, fontSize: 12.5, padding: "6px 11px", borderRadius: 3, cursor: "pointer", background: draft.services[k] ? C.ink : C.panel, color: draft.services[k] ? "#fff" : C.ink2, border: `1px solid ${draft.services[k] ? C.ink : C.rule}` }}>
                {SERVICE_LABELS[k]}
              </button>
            ))}
          </div>
          <div className="grid gap-3 mt-4" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
            <Field label="One-time fee"><NumIn value={draft.projectFee} onChange={(e) => set({ projectFee: e.target.value })} /></Field>
            <Field label="Upfront %"><NumIn value={draft.depositPct} onChange={(e) => set({ depositPct: e.target.value })} /></Field>
            <Field label="Monitoring / mo"><NumIn value={draft.monitoringMonthly} onChange={(e) => set({ monitoringMonthly: e.target.value })} /></Field>
          </div>
          <div className="grid gap-3 mt-4" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <Field label="Lead source"><TextIn value={draft.lead.source} placeholder="Nolan Klein, inbound, partner" onChange={(e) => set({ lead: { ...draft.lead, source: e.target.value } })} /></Field>
            <Field label="Referral fee owed to"><TextIn value={draft.lead.partner} placeholder="leave empty if nobody" onChange={(e) => set({ lead: { ...draft.lead, partner: e.target.value } })} /></Field>
          </div>
        </Panel>
        <Panel title="What happens when you save">
          <ul style={{ fontSize: 13, color: C.ink2, lineHeight: 1.7 }}>
            <li>{ritvik?.email ? `Email to ${ritvik.name} (cc ${cas?.name || "Cas"}) asking for the audit${draft.services.vpat ? " and VPAT" : ""} cost.` : "No email to Ritvik: his address is not set (gear icon)."}</li>
            <li>{cas?.email ? `Email to ${cas.name} asking for Denis hours, her hours${draft.services.pdf ? ", PDF cost" : ""}.` : "No email to Cas: her address is not set (gear icon)."}</li>
            <li>Replies are read every Monday and the numbers go into the P&L.</li>
          </ul>
        </Panel>
        <div className="flex gap-2">
          <Btn kind="primary" onClick={() => onCreate(draft)}>Save and send</Btn>
          <Btn onClick={() => { setStage("idle"); setDraft(null); }}>Discard</Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="grid gap-4" style={{ maxWidth: 640 }}>
      <div className="flex gap-1" style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4, padding: 4 }}>
        {[["contract", "Signed contract"], ["note", "No contract, just describe it"]].map(([k, l]) => (
          <button key={k} onClick={() => setMode(k)} style={{ flex: 1, fontFamily: SANS, fontSize: 12.5, padding: "7px 10px", borderRadius: 3, cursor: "pointer", border: "none", background: mode === k ? C.ink : "transparent", color: mode === k ? "#fff" : C.ink2, fontWeight: mode === k ? 600 : 400 }}>{l}</button>
        ))}
      </div>
      <Panel title={mode === "contract" ? "Signed contract" : "Scope or notes"}>
        <div onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); parse(e.dataTransfer.files[0], null); }}
          style={{ border: `1px dashed ${C.rule}`, borderRadius: 4, padding: "30px 20px", textAlign: "center", background: C.bg }}>
          {stage === "parsing" ? <p style={{ fontFamily: MONO, fontSize: 12, color: C.ink2 }}>Reading...</p> : (
            <>
              <p style={{ fontSize: 13.5, marginBottom: 10 }}>Drop the PDF here</p>
              <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,.md,image/*" onChange={(e) => parse(e.target.files[0], null)} style={{ display: "none" }} />
              <Btn kind="primary" onClick={() => fileRef.current?.click()}>Choose a file</Btn>
            </>
          )}
        </div>
        {err && <p style={{ fontSize: 12, color: C.red, marginTop: 10 }}>{err}</p>}
        <textarea rows={3} value={pasted} onChange={(e) => setPasted(e.target.value)} placeholder="or type it: Manual audit for Acme, 7 templates, $3,500, 50/50, no monitoring" style={{ ...inputStyle, resize: "vertical", marginTop: 12 }} />
        <div className="flex gap-2 mt-2">
          <Btn onClick={() => pasted.trim() && parse(null, pasted)} disabled={stage === "parsing"}>Read this</Btn>
          <Btn onClick={() => { setDraft(newProject()); setStage("review"); }}>Blank project</Btn>
        </div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ detail */
function Detail({ p, settings, onChange, onDelete, onBack }) {
  const n = pnl(p, settings);
  const cur = settings.currency;
  const set = (patch) => onChange({ ...p, ...patch });
  const setCost = (k, patch) => set({ costs: { ...p.costs, [k]: { ...p.costs[k], ...patch } } });
  const [open, setOpen] = useState(null);
  const [msg, setMsg] = useState("");
  const [preview, setPreview] = useState(null);

  async function ingest() {
    setMsg("Reading replies...");
    try { const u = await api(`/api/projects/${p.id}/ingest`, { method: "POST" }); onChange(u); setMsg(u.lastReplyNote || "No replies yet."); }
    catch (e) { setMsg(e.message); }
  }
  async function resend(kind) {
    setMsg(`Sending to ${kind}...`);
    try { const u = await api(`/api/projects/${p.id}/request/${kind}`, { method: "POST" }); onChange(u); setMsg(u.requests?.[kind]?.error || `Sent ${u.requests?.[kind]?.sentAt}`); }
    catch (e) { setMsg(e.message); }
  }
  async function showPreview(kind) {
    try { setPreview(await api(`/api/projects/${p.id}/preview/${kind}`)); } catch (e) { setMsg(e.message); }
  }

  const costLine = (key, label, amountValue, editor) => (
    <div key={key}>
      <Row label={label} value={"-" + money(amountValue, cur)} onClick={() => setOpen(open === key ? null : key)} />
      {open === key && <div className="grid gap-3 mt-2 mb-3" style={{ gridTemplateColumns: "1fr 1fr 1fr", padding: "10px 12px", background: C.bg, borderRadius: 3 }}>{editor}</div>}
    </div>
  );
  const paidField = (k) => <Field label="Paid out on"><TextIn type="date" value={p.costs[k].paidAt} onChange={(e) => setCost(k, { paidAt: e.target.value })} /></Field>;
  const noteField = (k) => <Field label="Note"><TextIn value={p.costs[k].note} onChange={(e) => setCost(k, { note: e.target.value })} /></Field>;
  const sold = (k) => p.services[k];

  return (
    <div className="grid gap-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">
          <Btn onClick={onBack}>&larr; Projects</Btn>
          <input value={p.client} onChange={(e) => set({ client: e.target.value })} placeholder="Client" style={{ ...inputStyle, fontSize: 19, fontWeight: 600, border: "1px solid transparent", background: "transparent", width: 320 }} />
          <Chip tone={paymentState(p) === "paid" ? "green" : "amber"}>{STATE_LABEL[paymentState(p)]}</Chip>
        </div>
        <div className="flex items-center gap-2">
          <label className="flex items-center gap-2" style={{ fontSize: 12.5, color: C.ink2 }}>
            <input type="checkbox" checked={p.closed} onChange={(e) => set({ closed: e.target.checked })} /> Closed
          </label>
          <Btn kind="danger" onClick={onDelete}>Delete</Btn>
        </div>
      </div>

      <div className="grid gap-4" style={{ gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)" }}>
        <Panel title="P&L" right={<span style={{ fontSize: 11, color: C.ink3 }}>click a line to edit</span>}>
          <Row label="Contract value" value={money(n.fee, cur)} strong />
          {(sold("audit") || sold("remediation")) && costLine("audit", "Manual audit, Ritvik", n.audit, <>
            <Field label="Cost"><NumIn value={p.costs.audit.amount} onChange={(e) => setCost("audit", { amount: e.target.value })} /></Field>{paidField("audit")}{noteField("audit")}
          </>)}
          {sold("vpat") && costLine("vpat", "VPAT, Ritvik", n.vpat, <>
            <Field label="Cost"><NumIn value={p.costs.vpat.amount} onChange={(e) => setCost("vpat", { amount: e.target.value })} /></Field>{paidField("vpat")}{noteField("vpat")}
          </>)}
          {sold("remediation") && costLine("dev", `Development, Denis (${num(p.costs.dev.hours)}h)`, n.dev, <>
            <Field label="Hours"><NumIn value={p.costs.dev.hours} onChange={(e) => setCost("dev", { hours: e.target.value })} /></Field>{paidField("dev")}{noteField("dev")}
          </>)}
          {sold("pdf") && costLine("pdf", "PDF remediation", n.pdf, <>
            <Field label="Cost"><NumIn value={p.costs.pdf.amount} onChange={(e) => setCost("pdf", { amount: e.target.value })} /></Field>{paidField("pdf")}{noteField("pdf")}
          </>)}
          {costLine("pm", `Project management, Cas (${num(p.costs.pm.hours)}h)`, n.pm, <>
            <Field label="Hours"><NumIn value={p.costs.pm.hours} onChange={(e) => setCost("pm", { hours: e.target.value })} /></Field>{paidField("pm")}{noteField("pm")}
          </>)}
          {(p.lead.partner || n.referral > 0) && costLine("referral", `Referral, ${p.lead.partner || "partner"}`, n.referral, <>
            <Field label="Amount"><NumIn value={p.costs.referral.amount} onChange={(e) => setCost("referral", { amount: e.target.value })} /></Field>{paidField("referral")}{noteField("referral")}
          </>)}
          {costLine("sales", "Sales fee, Gabriel", n.sales, <>
            <Field label="Amount"><NumIn value={p.costs.sales.amount} onChange={(e) => setCost("sales", { amount: e.target.value })} /></Field>{paidField("sales")}{noteField("sales")}
          </>)}
          <Row label="Margin" value={`${money(n.margin, cur)}   ${n.marginPct.toFixed(0)}%`} strong tone={n.margin < 0 ? "red" : "green"} />

          {p.services.monitoring && (
            <div className="mt-4">
              <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: ".08em", textTransform: "uppercase", color: C.ink3, marginBottom: 4 }}>Monitoring, {n.state === "running" ? "running" : "starts at handover"}</div>
              <Row label={`${n.mMonths} months billed at ${money(n.mFee, cur)}`} value={money(n.mRevenue, cur)} />
              <Row label="Dev hours on fixes" value={"-" + money(n.mCost, cur)} />
              <Row label="Monitoring margin" value={money(n.mMargin, cur)} strong tone={n.mMargin < 0 ? "red" : "green"} />
            </div>
          )}
        </Panel>

        <div className="grid gap-4" style={{ alignContent: "start" }}>
          <Panel title="Payments">
            <PayLine label={`Deposit ${p.depositPct}%`} amount={n.deposit} paidAt={p.deposit.paidAt} cur={cur} onChange={(d) => set({ deposit: { ...p.deposit, paidAt: d } })} />
            <PayLine label="Balance on completion" amount={n.balance} paidAt={p.balance.paidAt} cur={cur} onChange={(d) => set({ balance: { ...p.balance, paidAt: d } })}
              hint={!p.deliveredAt ? "not handed over yet" : p.balance.invoicedAt ? `invoiced ${p.balance.invoicedAt}` : "handed over, invoice it"} />
            {p.services.monitoring
              ? <PayLine label="Monitoring" amount={n.mFee} cur={cur} hint={n.state === "running" ? `running since ${p.deliveredAt}, ${n.mMonths} months logged` : "starts when remediation is handed over"} />
              : <PayLine label="Monitoring" amount={0} cur={cur} muted hint={p.upsellCall.bookedAt ? `call booked ${p.upsellCall.bookedAt}` : "not sold, book the call after handover"} />}
            <div className="grid gap-3 mt-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
              <Field label="Handed over"><TextIn type="date" value={p.deliveredAt} onChange={(e) => set({ deliveredAt: e.target.value })} /></Field>
              <Field label="Balance invoiced"><TextIn type="date" value={p.balance.invoicedAt} onChange={(e) => set({ balance: { ...p.balance, invoicedAt: e.target.value } })} /></Field>
            </div>
          </Panel>

          <Panel title="Where the numbers come from" right={<Btn onClick={ingest}>Read replies now</Btn>}>
            {["ritvik", "cas"].map((k) => {
              const r = p.requests?.[k];
              const who = settings.team.find((t) => t.id === k)?.name || k;
              return (
                <div key={k} className="flex items-center justify-between gap-3" style={{ padding: "7px 0", borderBottom: `1px solid ${C.rule}` }}>
                  <span style={{ fontSize: 13 }}>{who}</span>
                  <span className="flex items-center gap-2">
                    {r?.sentAt ? <Chip tone="green">asked {r.sentAt}</Chip> : r?.error ? <Chip tone="red">{r.error.slice(0, 40)}</Chip> : <Chip tone="amber">not asked</Chip>}
                    <button onClick={() => showPreview(k)} style={{ background: "none", border: "none", color: C.ink3, cursor: "pointer", fontSize: 12 }}>preview</button>
                    <button onClick={() => resend(k)} style={{ background: "none", border: "none", color: C.ink3, cursor: "pointer", fontSize: 12 }}>send again</button>
                  </span>
                </div>
              );
            })}
            {msg && <p style={{ fontSize: 12, color: C.ink2, marginTop: 8 }}>{msg}</p>}
            {preview && (
              <pre style={{ marginTop: 10, background: C.bg, padding: 12, borderRadius: 3, fontFamily: SANS, fontSize: 12.5, color: C.ink2, whiteSpace: "pre-wrap" }}>
                To: {preview.to || "(no address set)"}{preview.cc ? `\nCc: ${preview.cc}` : ""}{"\n"}Subject: {preview.subject}{"\n\n"}{preview.body}
              </pre>
            )}
          </Panel>

          {p.services.monitoring && n.state === "running" && <MonitoringLog p={p} set={set} settings={settings} />}
          {p.deliveredAt && !p.services.monitoring && (
            <Panel title="Monitoring upsell">
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="Call booked"><TextIn type="date" value={p.upsellCall.bookedAt} onChange={(e) => set({ upsellCall: { ...p.upsellCall, bookedAt: e.target.value } })} /></Field>
                <Field label="Outcome"><TextIn value={p.upsellCall.outcome} onChange={(e) => set({ upsellCall: { ...p.upsellCall, outcome: e.target.value } })} /></Field>
              </div>
            </Panel>
          )}
        </div>
      </div>
    </div>
  );
}

function MonitoringLog({ p, set, settings }) {
  const [m, setM] = useState({ month: thisMonth(), hours: "" });
  const cur = settings.currency;
  return (
    <Panel title="Monitoring months">
      {(p.monitoringLog || []).map((e, i) => (
        <div key={i} className="flex items-center justify-between gap-3" style={{ padding: "6px 0", borderBottom: `1px solid ${C.rule}` }}>
          <span style={{ fontFamily: MONO, fontSize: 12 }}>{monthName(e.month)}</span>
          <span style={{ fontSize: 12.5, color: C.ink2, flex: 1 }}>{num(e.hours)}h fixes</span>
          {e.paidAt ? <Chip tone="green">paid {e.paidAt}</Chip> : <Btn kind="good" onClick={() => set({ monitoringLog: p.monitoringLog.map((x, j) => (j === i ? { ...x, paidAt: today() } : x)) })}>Mark paid</Btn>}
          <button onClick={() => set({ monitoringLog: p.monitoringLog.filter((_, j) => j !== i) })} style={{ background: "none", border: "none", cursor: "pointer", color: C.ink3 }}>&times;</button>
        </div>
      ))}
      <div className="flex gap-2 items-end mt-3">
        <Field label="Month"><TextIn type="month" value={m.month} onChange={(e) => setM({ ...m, month: e.target.value })} /></Field>
        <Field label="Dev hours"><NumIn value={m.hours} onChange={(e) => setM({ ...m, hours: e.target.value })} style={{ width: 90 }} /></Field>
        <Btn onClick={() => { if (!m.month) return; set({ monitoringLog: [...(p.monitoringLog || []), { ...m, paidAt: "" }] }); setM({ month: thisMonth(), hours: "" }); }}>Log month</Btn>
      </div>
    </Panel>
  );
}

/* --------------------------------------------------------------- cash flow */
function CashFlowTab({ projects, settings }) {
  const cur = settings.currency;
  const rows = useMemo(() => cashFlow(projects, settings), [projects, settings]);
  const [open, setOpen] = useState(null);
  if (rows.length === 0) return <Panel><p style={{ padding: 20, textAlign: "center", fontSize: 13, color: C.ink3 }}>Nothing yet. Money shows up here on the day it's marked paid in or paid out.</p></Panel>;
  const peak = Math.max(...rows.map((r) => Math.max(r.in, r.out, 1)));
  const tot = rows.reduce((a, r) => ({ in: a.in + r.in, out: a.out + r.out }), { in: 0, out: 0 });
  return (
    <div className="grid gap-4">
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(3,1fr)" }}>
        {[["Cash in", tot.in, C.green], ["Cash out", tot.out, C.red], ["Net", tot.in - tot.out, tot.in - tot.out < 0 ? C.red : C.green]].map(([l, v, c]) => (
          <div key={l} style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4, padding: "11px 13px" }}>
            <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".1em", textTransform: "uppercase", color: C.ink3 }}>{l}</div>
            <div style={{ fontFamily: MONO, fontSize: 19, marginTop: 5, color: c }}>{money(v, cur)}</div>
          </div>
        ))}
      </div>
      <Panel title="Month by month" pad={false}>
        {rows.map((r) => (
          <div key={r.month}>
            <div onClick={() => setOpen(open === r.month ? null : r.month)} className="grid items-center gap-4" style={{ gridTemplateColumns: "110px 1fr 110px 110px 110px", padding: "10px 14px", borderBottom: `1px solid ${C.rule}`, cursor: "pointer" }}>
              <span style={{ fontSize: 13.5, fontWeight: 600 }}>{monthName(r.month)}</span>
              <div className="grid gap-1">
                <div style={{ height: 8, width: `${(r.in / peak) * 100}%`, background: C.green, borderRadius: 2 }} />
                <div style={{ height: 8, width: `${(r.out / peak) * 100}%`, background: C.red, borderRadius: 2, opacity: 0.7 }} />
              </div>
              <span style={{ fontFamily: MONO, fontSize: 13, textAlign: "right", color: C.green }}>{money(r.in, cur)}</span>
              <span style={{ fontFamily: MONO, fontSize: 13, textAlign: "right", color: C.red }}>-{money(r.out, cur)}</span>
              <span style={{ fontFamily: MONO, fontSize: 13, textAlign: "right", fontWeight: 600, color: r.net < 0 ? C.red : C.ink }}>{money(r.net, cur)}</span>
            </div>
            {open === r.month && r.lines.map((l, i) => (
              <div key={i} className="flex justify-between" style={{ padding: "5px 14px 5px 40px", fontSize: 12.5, color: C.ink2, background: C.bg }}>
                <span><span style={{ fontFamily: MONO, color: C.ink3, marginRight: 10 }}>{l.date}</span>{l.label}</span>
                <span style={{ fontFamily: MONO, color: l.dir === "in" ? C.green : C.red }}>{l.dir === "in" ? "" : "-"}{money(l.amt, cur)}</span>
              </div>
            ))}
          </div>
        ))}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ gear */
function Gear({ settings, setSettings, gmailConnected, onClose }) {
  const s = settings;
  const setTeam = (i, patch) => setSettings({ ...s, team: s.team.map((t, j) => (j === i ? { ...t, ...patch } : t)) });
  const rules = s.referralRules || [];
  const setRule = (i, patch) => setSettings({ ...s, referralRules: rules.map((r, j) => (j === i ? { ...r, ...patch } : r)) });
  return (
    <div className="grid gap-4" style={{ maxWidth: 640 }}>
      <div className="flex items-center justify-between"><h2 style={{ fontSize: 16, fontWeight: 600 }}>Background settings</h2><Btn onClick={onClose}>Done</Btn></div>
      <Panel title="Gmail">
        {gmailConnected ? <Chip tone="green">connected</Chip> : <a href="/auth/google" style={{ fontSize: 13, color: C.red }}>Connect Gmail (needed for supplier emails and invoice lookup)</a>}
        <label className="flex items-center gap-2 mt-3" style={{ fontSize: 12.5, color: C.ink2 }}>
          <input type="checkbox" checked={!!s.autoEmails} onChange={(e) => setSettings({ ...s, autoEmails: e.target.checked })} /> Send supplier emails automatically when a project is saved
        </label>
      </Panel>
      <Panel title="Team">
        {s.team.map((t, i) => (
          <div key={t.id} className="grid gap-2 mb-2" style={{ gridTemplateColumns: "1fr 1.4fr" }}>
            <TextIn value={t.name} onChange={(e) => setTeam(i, { name: e.target.value })} />
            <TextIn value={t.email} placeholder={`${t.role} email`} onChange={(e) => setTeam(i, { email: e.target.value })} />
          </div>
        ))}
      </Panel>
      <Panel title="Rates">
        <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
          <Field label="Denis / hour"><NumIn value={s.rateDev} onChange={(e) => setSettings({ ...s, rateDev: e.target.value })} /></Field>
          <Field label="Cas / hour"><NumIn value={s.ratePm} onChange={(e) => setSettings({ ...s, ratePm: e.target.value })} /></Field>
          <Field label="Payment terms, days"><NumIn value={s.termsDays} onChange={(e) => setSettings({ ...s, termsDays: e.target.value })} /></Field>
        </div>
        <p style={{ fontSize: 11.5, color: C.ink3, marginTop: 8 }}>Ritvik and PDF are quoted per project, so they live on the project. Gabriel's fee: rule to be decided, entered per project for now.</p>
      </Panel>
      <Panel title="Referral fee rules" right={<Btn onClick={() => setSettings({ ...s, referralRules: [...rules, { match: "", partner: "", type: "pct", value: 0 }] })}>Add</Btn>}>
        {rules.length === 0 && <p style={{ fontSize: 12.5, color: C.ink3 }}>e.g. lead source contains "nolan" → 20% to Nolan Klein</p>}
        {rules.map((r, i) => (
          <div key={i} className="grid gap-2 mb-2 items-end" style={{ gridTemplateColumns: "1fr 1fr 90px 90px 30px" }}>
            <Field label="Source contains"><TextIn value={r.match} onChange={(e) => setRule(i, { match: e.target.value })} /></Field>
            <Field label="Paid to"><TextIn value={r.partner} onChange={(e) => setRule(i, { partner: e.target.value })} /></Field>
            <Field label="Type"><select value={r.type} onChange={(e) => setRule(i, { type: e.target.value })} style={inputStyle}><option value="pct">%</option><option value="fixed">fixed</option></select></Field>
            <Field label="Value"><NumIn value={r.value} onChange={(e) => setRule(i, { value: e.target.value })} /></Field>
            <button onClick={() => setSettings({ ...s, referralRules: rules.filter((_, j) => j !== i) })} style={{ background: "none", border: "none", color: C.ink3, cursor: "pointer", fontSize: 16 }}>&times;</button>
          </div>
        ))}
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ app */
function App() {
  const [tab, setTab] = useState("projects");
  const [projects, setProjects] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState("all");
  const [loaded, setLoaded] = useState(false);
  const [gmailConnected, setGmailConnected] = useState(false);
  const [note, setNote] = useState("");
  const [gear, setGear] = useState(false);

  useEffect(() => {
    (async () => {
      try { const s = await api("/api/state"); setProjects(s.projects); setSettings(s.settings); setGmailConnected(s.gmailConnected); }
      catch (e) { setNote(e.message); }
      setLoaded(true);
    })();
  }, []);
  useEffect(() => {
    if (!loaded) return;
    api("/api/settings", { method: "PUT", body: JSON.stringify(settings) }).then(() => setNote("Saved")).catch((e) => setNote("Not saved: " + e.message));
  }, [settings, loaded]);

  const upsert = (proj) => {
    setProjects((ps) => ps.map((x) => (x.id === proj.id ? proj : x)));
    clearTimeout(upsert.t?.[proj.id]); upsert.t = upsert.t || {};
    upsert.t[proj.id] = setTimeout(() => api(`/api/projects/${proj.id}`, { method: "PUT", body: JSON.stringify(proj) }).then(() => setNote("Saved")).catch((e) => setNote("Not saved: " + e.message)), 400);
  };
  const create = async (p) => {
    setNote("Saving and emailing...");
    const r = await api("/api/projects", { method: "POST", body: JSON.stringify(p) });
    setProjects((ps) => [r.project, ...ps]);
    setNote(r.emails.length ? `Saved. Emailed ${r.emails.join(" and ")}.` : "Saved. No emails sent, team addresses not set.");
    setSelected(r.project.id); setTab("projects");
  };
  const remove = async (id) => { await api(`/api/projects/${id}`, { method: "DELETE" }); setProjects((ps) => ps.filter((x) => x.id !== id)); };

  const cur = settings.currency;
  const sel = projects.find((p) => p.id === selected);
  const tasks = useMemo(() => projects.flatMap((p) => tasksFor(p, settings)), [projects, settings]);
  const totals = useMemo(() => projects.reduce((a, p) => { const n = pnl(p, settings); a.fee += n.fee; a.margin += n.margin; a.out += n.outstanding; a.mrr += p.closed ? 0 : n.mrr; return a; }, { fee: 0, margin: 0, out: 0, mrr: 0 }), [projects, settings]);
  const shown = projects.filter((p) => filter === "all" ? !p.closed : filter === "closed" ? p.closed : !p.closed && paymentState(p) === filter);

  const TABS = [["intake", "New project"], ["projects", "Projects"], ["cash", "Cash flow"]];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: SANS, color: C.ink }}>
      <div style={{ maxWidth: 1140, margin: "0 auto", padding: "22px 20px 60px" }}>
        <header className="flex items-end justify-between flex-wrap gap-3" style={{ marginBottom: 18 }}>
          <div>
            <h1 style={{ fontSize: 20, fontWeight: 650, letterSpacing: "-.01em" }}>{"Manual Services Ledger & P&L"}</h1>
            <p style={{ fontFamily: MONO, fontSize: 11, color: C.ink3, marginTop: 3 }}>AccessibilityChecker.org</p>
          </div>
          <div className="flex items-center gap-3">
            <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.ink3 }}>{note}</span>
            <button onClick={() => setGear(!gear)} title="Background settings" style={{ background: "none", border: `1px solid ${C.rule}`, borderRadius: 3, cursor: "pointer", padding: "5px 8px", color: gmailConnected ? C.ink2 : C.red, fontSize: 14 }}>⚙</button>
          </div>
        </header>

        {gear ? <Gear settings={settings} setSettings={setSettings} gmailConnected={gmailConnected} onClose={() => setGear(false)} /> : (
          <>
            <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", marginBottom: 18 }}>
              {[["Booked", money(totals.fee, cur), C.ink], ["Margin", money(totals.margin, cur), totals.margin < 0 ? C.red : C.green], ["Unpaid", money(totals.out, cur), totals.out > 0 ? C.red : C.ink2], ["Live MRR", money(totals.mrr, cur), C.green]].map(([l, v, c]) => (
                <div key={l} style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4, padding: "11px 13px" }}>
                  <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".1em", textTransform: "uppercase", color: C.ink3 }}>{l}</div>
                  <div style={{ fontFamily: MONO, fontSize: 19, marginTop: 5, color: c }}>{v}</div>
                </div>
              ))}
            </div>

            <nav className="flex gap-1" style={{ borderBottom: `1px solid ${C.rule}`, marginBottom: 18 }}>
              {TABS.map(([k, l]) => (
                <button key={k} onClick={() => { setTab(k); setSelected(null); }} style={{ fontFamily: SANS, fontSize: 13, padding: "8px 13px", cursor: "pointer", background: "transparent", border: "none", borderBottom: `2px solid ${tab === k ? C.ink : "transparent"}`, color: tab === k ? C.ink : C.ink3, fontWeight: tab === k ? 600 : 400 }}>{l}</button>
              ))}
            </nav>

            {tab === "intake" && <Intake settings={settings} onCreate={create} />}
            {tab === "cash" && <CashFlowTab projects={projects} settings={settings} />}
            {tab === "projects" && (sel ? (
              <Detail p={sel} settings={settings} onChange={upsert} onBack={() => setSelected(null)} onDelete={async () => { await remove(sel.id); setSelected(null); }} />
            ) : (
              <div className="grid gap-4">
                {tasks.length > 0 && (
                  <div className="flex flex-wrap gap-2">
                    {tasks.map((t) => (
                      <button key={t.key} onClick={() => setSelected(t.project.id)} style={{ fontFamily: SANS, fontSize: 12, padding: "5px 10px", borderRadius: 3, cursor: "pointer", background: C.panel, border: `1px solid ${C.rule}`, borderLeft: `3px solid ${t.level === "red" ? C.red : t.level === "amber" ? C.amber : t.level === "green" ? C.green : C.slate}`, color: C.ink2 }}>
                        <b style={{ color: C.ink }}>{t.project.client || "Untitled"}</b>: {t.title}
                      </button>
                    ))}
                  </div>
                )}
                <Panel pad={false} title={`${shown.length} project${shown.length === 1 ? "" : "s"}`} right={
                  <div className="flex gap-1">
                    {[["all", "Open"], ["awaiting-deposit", "Awaiting deposit"], ["balance-remaining", "Balance remaining"], ["paid", "Paid in full"], ["closed", "Closed"]].map(([k, l]) => (
                      <button key={k} onClick={() => setFilter(k)} style={{ fontFamily: SANS, fontSize: 11.5, padding: "4px 9px", borderRadius: 3, cursor: "pointer", border: `1px solid ${filter === k ? C.ink : C.rule}`, background: filter === k ? C.ink : C.panel, color: filter === k ? "#fff" : C.ink2 }}>{l}</button>
                    ))}
                  </div>}>
                  {shown.length === 0 ? <p style={{ padding: 26, fontSize: 13, color: C.ink3, textAlign: "center" }}>Nothing here.</p> : (
                    <table style={{ width: "100%", borderCollapse: "collapse" }}>
                      <thead><tr style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".08em", textTransform: "uppercase", color: C.ink3 }}>
                        {["Client", "Sold", "Deposit", "Balance", "Monitoring", "Margin"].map((h, i) => <th key={h} style={{ textAlign: i >= 5 ? "right" : "left", padding: "8px 14px", borderBottom: `1px solid ${C.rule}`, fontWeight: 400 }}>{h}</th>)}
                      </tr></thead>
                      <tbody>
                        {shown.map((p) => {
                          const n = pnl(p, settings);
                          const pay = (paidAt, amt) => paidAt ? <Chip tone="green">paid</Chip> : <span style={{ fontFamily: MONO, fontSize: 12, color: C.amber }}>{money(amt, cur)} due</span>;
                          return (
                            <tr key={p.id} onClick={() => setSelected(p.id)} style={{ cursor: "pointer", borderBottom: `1px solid ${C.rule}` }}>
                              <td style={{ padding: "10px 14px", fontSize: 13.5, fontWeight: 500 }}>{p.client || "Untitled"}</td>
                              <td style={{ padding: "10px 14px" }}><span className="flex gap-1 flex-wrap">{Object.keys(SERVICE_LABELS).filter((k) => p.services[k]).map((k) => <Chip key={k} tone={k === "monitoring" ? (n.state === "running" ? "green" : "amber") : "slate"}>{SHORT[k]}</Chip>)}</span></td>
                              <td style={{ padding: "10px 14px" }}>{pay(p.deposit.paidAt, n.deposit)}</td>
                              <td style={{ padding: "10px 14px" }}>{p.deliveredAt ? pay(p.balance.paidAt, n.balance) : <span style={{ fontSize: 12, color: C.ink3 }}>in progress</span>}</td>
                              <td style={{ padding: "10px 14px", fontSize: 12, color: C.ink2 }}>{!p.services.monitoring ? <span style={{ color: C.ink3 }}>none</span> : n.state === "running" ? `${money(n.mFee, cur)}/mo` : <span style={{ color: C.amber }}>{money(n.mFee, cur)}/mo after handover</span>}</td>
                              <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13, color: n.margin < 0 ? C.red : C.green }}>{money(n.margin, cur)} <span style={{ color: C.ink3 }}>{n.marginPct.toFixed(0)}%</span></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}
                </Panel>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
