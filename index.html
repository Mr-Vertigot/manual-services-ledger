<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ tokens */
const C = {
  bg: "#EFF2F1",
  panel: "#FFFFFF",
  ink: "#131C19",
  ink2: "#57635F",
  ink3: "#8A9490",
  rule: "#DCE3E0",
  green: "#0B6B53",
  greenSoft: "#E2F0EB",
  red: "#A93520",
  redSoft: "#F8E7E3",
  amber: "#8A6608",
  amberSoft: "#F7EFDB",
  slate: "#2B4A5E",
  slateSoft: "#E6EDF2",
};
const MONO = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace';
const SANS = 'ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif';

const KEY_PROJECTS = "ace:remediation:projects";
const KEY_SETTINGS = "ace:remediation:settings";

const DEFAULT_SETTINGS = {
  currency: "$",
  rateDev: 30,
  pmPct: 5,
  salesPct: 10,
  termsDays: 7,
  team: [
    { id: "pm", role: "Project management", name: "Casandra Visser", email: "" },
    { id: "auditor", role: "Manual audit and VPAT", name: "Ritvik", email: "" },
    { id: "dev", role: "Developer", name: "Igor", email: "" },
  ],
  lastTimesheetRun: "",
  lastReconcile: "",
};


async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function parseJSON(text) {
  const clean = text.replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  return JSON.parse(start > 0 ? clean.slice(start) : clean);
}

const SERVICE_LABELS = {
  remediation: "Remediation",
  audit: "Manual audit",
  vpat: "VPAT",
  pdf: "PDF remediation",
  monitoring: "Monitoring",
};
const ONE_TIME = ["remediation", "audit", "vpat", "pdf"];
const SHORT = { remediation: "REM", audit: "AUDIT", vpat: "VPAT", pdf: "PDF", monitoring: "MON" };

/* ------------------------------------------------------------------ helpers */
const uid = () => Math.random().toString(36).slice(2, 10);
const num = (v) => (isNaN(parseFloat(v)) ? 0 : parseFloat(v));
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => today().slice(0, 7);
const daysBetween = (a, b) =>
  Math.round((new Date(b) - new Date(a)) / 86400000);
const monthName = (m) =>
  new Date(m + "-02").toLocaleDateString("en-US", { month: "short", year: "numeric" });

function money(v, cur = "$") {
  const n = num(v);
  const s = Math.abs(n).toLocaleString("en-US", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 0,
  });
  return (n < 0 ? "-" : "") + cur + s;
}

function newProject(partial = {}) {
  return {
    id: uid(),
    client: "",
    contractDate: today(),
    status: "active",
    services: { remediation: true, audit: false, vpat: false, pdf: false, monitoring: false },
    projectFee: 0,
    depositPct: 50,
    monitoringMonthly: 0,
    monitoringMonths: 12,
    monitoringStartsAt: "",
    monitoringLog: [],
    lead: { source: "", partner: "", feeType: "pct", feeValue: 0, feePaid: false },
    auditCost: 0,
    vpatCost: 0,
    pdfCost: 0,
    devLog: [],
    devRateOverride: null,
    deposit: { invoiceNo: "", invoicedAt: "", dueAt: "", paidAt: "" },
    balance: { invoiceNo: "", invoicedAt: "", dueAt: "", paidAt: "" },
    deliveredAt: "",
    upsellCall: { bookedAt: "", outcome: "" },
    notes: "",
    ...partial,
  };
}

function devRate(p, s) {
  return p.devRateOverride === null || p.devRateOverride === "" ? num(s.rateDev) : num(p.devRateOverride);
}

function devHours(p) {
  return (p.devLog || []).reduce((a, e) => a + num(e.hours), 0);
}

/* monitoring cannot run before the one-time work is handed over */
function monitoringState(p) {
  if (!p.services.monitoring) return "none";
  if (!p.deliveredAt) return "pending";
  const start = p.monitoringStartsAt || p.deliveredAt;
  return start > today() ? "pending" : "running";
}

function dueDate(inv, s) {
  if (!inv) return "";
  if (inv.dueAt) return inv.dueAt;
  if (!inv.invoicedAt) return "";
  const d = new Date(inv.invoicedAt);
  d.setDate(d.getDate() + num(s.termsDays));
  return d.toISOString().slice(0, 10);
}

function overdueBy(inv, s) {
  const due = dueDate(inv, s);
  return due ? daysBetween(due, today()) : null;
}

function pnl(p, s) {
  const dr = devRate(p, s);
  const dh = devHours(p);

  /* ---- one time: remediation, manual audit, VPAT, PDF remediation ---- */
  const fee = num(p.projectFee);
  const referral =
    p.lead.feeType === "pct" ? (fee * num(p.lead.feeValue)) / 100 : num(p.lead.feeValue);
  const audit = num(p.auditCost);
  const vpat = num(p.vpatCost);
  const pdf = num(p.pdfCost);
  const dev = dh * dr;
  const labor = audit + vpat + pdf + dev;
  const pm = (fee * num(s.pmPct)) / 100;
  const sales = (fee * num(s.salesPct)) / 100;
  const overhead = pm + sales;
  const cost = referral + labor + overhead;
  const margin = fee - cost;

  /* ---- ongoing: monitoring, one row per month actually served ---- */
  const mFee = num(p.monitoringMonthly);
  const state = monitoringState(p);
  const log = p.monitoringLog || [];
  const mHours = log.reduce((a, e) => a + num(e.hours), 0);
  const mRevenue = log.length * mFee;
  const mLabor = mHours * dr;
  const mOverhead = (mRevenue * (num(s.pmPct) + num(s.salesPct))) / 100;
  const mCost = mLabor + mOverhead;
  const mMargin = mRevenue - mCost;
  const mCollected = log.filter((e) => e.paidAt).length * mFee;
  const mOutstanding = mRevenue - mCollected;

  /* typical month, for the MRR view */
  const mAvgHours = log.length ? mHours / log.length : 0;
  const mMonthMargin = mFee - mAvgHours * dr - (mFee * (num(s.pmPct) + num(s.salesPct))) / 100;

  const deposit = (fee * num(p.depositPct)) / 100;
  const balance = fee - deposit;
  const collected = (p.deposit.paidAt ? deposit : 0) + (p.balance.paidAt ? balance : 0);

  return {
    fee, referral, labor, audit, vpat, pdf, dev, dh, dr, pm, sales, overhead, cost, margin,
    marginPct: fee ? (margin / fee) * 100 : 0,
    state, mFee, mHours, mRevenue, mLabor, mOverhead, mCost, mMargin, mCollected, mOutstanding,
    mMonths: log.length, mAvgHours, mMonthMargin,
    mMarginPct: mRevenue ? (mMargin / mRevenue) * 100 : 0,
    mrr: state === "running" ? mFee : 0,
    pendingMrr: state === "pending" ? mFee : 0,
    deposit, balance, collected,
    outstanding: fee - collected + mOutstanding,
    oneTimeOutstanding: fee - collected,
  };
}

/* month by month, one time recognised on handover, monitoring on the month served */
function monthlyPnl(projects, s) {
  const rows = {};
  const touch = (m) =>
    (rows[m] = rows[m] || { month: m, oneRev: 0, oneCost: 0, monRev: 0, monCost: 0 });

  projects.forEach((p) => {
    const n = pnl(p, s);
    if (p.deliveredAt && n.fee) {
      const r = touch(p.deliveredAt.slice(0, 7));
      r.oneRev += n.fee;
      r.oneCost += n.cost;
    }
    (p.monitoringLog || []).forEach((e) => {
      if (!e.month) return;
      const r = touch(e.month);
      r.monRev += n.mFee;
      r.monCost += num(e.hours) * n.dr + (n.mFee * (num(s.pmPct) + num(s.salesPct))) / 100;
    });
  });

  return Object.values(rows)
    .map((r) => ({
      ...r,
      oneMargin: r.oneRev - r.oneCost,
      monMargin: r.monRev - r.monCost,
      total: r.oneRev - r.oneCost + (r.monRev - r.monCost),
      rev: r.oneRev + r.monRev,
    }))
    .sort((a, b) => (a.month < b.month ? 1 : -1));
}


function tasksFor(p, s) {
  const out = [];
  const k = (t) => `${p.id}:${t}`;
  if (p.status === "closed") return out;
  const n = pnl(p, s);

  if (!p.deposit.paidAt && n.deposit > 0) {
    const od = overdueBy(p.deposit, s);
    out.push({
      key: k("deposit"),
      level: od > 0 ? "red" : "amber",
      title: `Deposit unpaid: ${money(n.deposit, s.currency)}`,
      detail: p.deposit.invoicedAt
        ? `Invoice ${p.deposit.invoiceNo || "?"} due ${dueDate(p.deposit, s)}, ${od > 0 ? `${od} days overdue` : `due in ${-od} days`}.`
        : "Not invoiced yet. Work should not start before the deposit lands.",
      project: p,
    });
  }

  if (p.status === "delivered" && !p.balance.paidAt) {
    const od = overdueBy(p.balance, s);
    out.push({
      key: k("balance"),
      level: od > 0 ? "red" : "amber",
      title: `Balance unpaid: ${money(n.balance, s.currency)}`,
      detail: p.balance.invoicedAt
        ? `Invoice ${p.balance.invoiceNo || "?"} due ${dueDate(p.balance, s)}, ${od > 0 ? `${od} days overdue` : `due in ${-od} days`}.`
        : "Delivered but the balance has not been invoiced.",
      project: p,
    });
  }

  if (p.status === "delivered" && !p.services.monitoring && !p.upsellCall.bookedAt) {
    out.push({
      key: k("upsell"),
      level: "slate",
      title: "Book the monitoring call",
      detail:
        "No monitoring on this contract. Sales should call before the site drifts out of compliance: core updates, plugin updates and client edits are not covered once remediation ends.",
      project: p,
    });
  }

  if (p.services.monitoring && p.status !== "draft") {
    const st = monitoringState(p);
    if (st === "pending") {
      out.push({
        key: k("monitoring-pending"),
        level: "slate",
        title: `Monitoring signed but not started: ${money(n.mFee, s.currency)}/mo`,
        detail: p.deliveredAt
          ? `Starts ${p.monitoringStartsAt || p.deliveredAt}. Not counted in MRR until then.`
          : "Starts once remediation is handed over. Not counted in MRR yet.",
        project: p,
      });
    } else if (st === "running" && !(p.monitoringLog || []).some((e) => e.month === thisMonth())) {
      out.push({
        key: k("monitoring"),
        level: "green",
        title: `Log ${monthName(thisMonth())} monitoring for ${p.client || "this client"}`,
        detail: `${money(n.mFee, s.currency)}/mo. Run the scan, fix what it finds, then log the dev hours so the month has a real margin.`,
        project: p,
      });
    }
  }

  if (p.lead.partner && !p.lead.feePaid && num(n.referral) > 0 && p.deposit.paidAt) {
    out.push({
      key: k("referral"),
      level: "amber",
      title: `Referral fee owed to ${p.lead.partner}: ${money(n.referral, s.currency)}`,
      detail: "Deposit has landed, so the payout is due.",
      project: p,
    });
  }
  return out;
}

/* ------------------------------------------------------------------ atoms */
function Field({ label, hint, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span
        className="uppercase"
        style={{ fontFamily: MONO, fontSize: 10, letterSpacing: ".08em", color: C.ink3 }}
      >
        {label}
      </span>
      {children}
      {hint && (
        <span style={{ fontSize: 11, color: C.ink3 }}>{hint}</span>
      )}
    </label>
  );
}

const inputStyle = {
  fontFamily: SANS,
  fontSize: 13,
  color: C.ink,
  background: C.panel,
  border: `1px solid ${C.rule}`,
  borderRadius: 3,
  padding: "7px 9px",
  width: "100%",
  outline: "none",
};

function TextIn(props) {
  return <input {...props} style={{ ...inputStyle, ...(props.style || {}) }} />;
}
function NumIn(props) {
  return (
    <input
      {...props}
      type="number"
      style={{ ...inputStyle, fontFamily: MONO, textAlign: "right", ...(props.style || {}) }}
    />
  );
}

function Chip({ tone = "slate", children }) {
  const map = {
    green: [C.greenSoft, C.green],
    red: [C.redSoft, C.red],
    amber: [C.amberSoft, C.amber],
    slate: [C.slateSoft, C.slate],
  };
  const [bg, fg] = map[tone] || map.slate;
  return (
    <span
      style={{
        background: bg, color: fg, fontFamily: MONO, fontSize: 10,
        letterSpacing: ".06em", textTransform: "uppercase",
        padding: "3px 6px", borderRadius: 3, whiteSpace: "nowrap",
      }}
    >
      {children}
    </span>
  );
}

function Btn({ kind = "ghost", children, ...rest }) {
  const base = {
    fontFamily: SANS, fontSize: 12.5, fontWeight: 500, padding: "7px 12px",
    borderRadius: 3, cursor: "pointer", border: `1px solid ${C.rule}`,
    background: C.panel, color: C.ink,
  };
  const kinds = {
    primary: { background: C.ink, color: "#fff", border: `1px solid ${C.ink}` },
    good: { background: C.green, color: "#fff", border: `1px solid ${C.green}` },
    ghost: {},
    danger: { color: C.red, border: `1px solid ${C.rule}` },
  };
  return (
    <button {...rest} style={{ ...base, ...kinds[kind], ...(rest.style || {}) }}>
      {children}
    </button>
  );
}

function Panel({ title, right, children, pad = true }) {
  return (
    <section
      style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4 }}
    >
      {title && (
        <header
          className="flex items-center justify-between"
          style={{ borderBottom: `1px solid ${C.rule}`, padding: "9px 14px" }}
        >
          <h2
            style={{
              fontFamily: MONO, fontSize: 10.5, letterSpacing: ".1em",
              textTransform: "uppercase", color: C.ink2,
            }}
          >
            {title}
          </h2>
          {right}
        </header>
      )}
      <div style={pad ? { padding: 14 } : undefined}>{children}</div>
    </section>
  );
}

/* the signature element: a margin ribbon that reads left to right as money leaves */
function MarginRibbon({ n, cur }) {
  if (!n.fee) return <div style={{ height: 26, background: C.bg, borderRadius: 3 }} />;
  const segs = [
    { label: "Referral", v: n.referral, c: "#8C6D3F" },
    { label: "Labor", v: n.labor, c: C.slate },
    { label: "PM + sales", v: n.overhead, c: "#7A8B86" },
    { label: "Margin", v: Math.max(n.margin, 0), c: C.green },
  ].filter((s) => s.v > 0);
  const total = Math.max(n.fee, n.cost);
  return (
    <div>
      <div className="flex" style={{ height: 26, borderRadius: 3, overflow: "hidden" }}>
        {segs.map((s) => (
          <div
            key={s.label}
            title={`${s.label} ${money(s.v, cur)}`}
            style={{
              width: `${(s.v / total) * 100}%`,
              background: s.c,
              borderRight: "1px solid rgba(255,255,255,.5)",
            }}
          />
        ))}
        {n.margin < 0 && (
          <div style={{ width: `${(-n.margin / total) * 100}%`, background: C.red }} />
        )}
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
        {segs.map((s) => (
          <span key={s.label} className="flex items-center gap-1.5" style={{ fontSize: 11, color: C.ink2 }}>
            <i style={{ width: 8, height: 8, background: s.c, borderRadius: 2, display: "inline-block" }} />
            {s.label}
            <b style={{ fontFamily: MONO, fontWeight: 500 }}>{money(s.v, cur)}</b>
          </span>
        ))}
      </div>
    </div>
  );
}

function Row({ label, value, strong, tone }) {
  return (
    <div
      className="flex items-baseline justify-between gap-4"
      style={{ padding: "5px 0", borderBottom: `1px solid ${C.rule}` }}
    >
      <span style={{ fontSize: 12.5, color: strong ? C.ink : C.ink2, fontWeight: strong ? 600 : 400 }}>
        {label}
      </span>
      <span
        style={{
          fontFamily: MONO, fontSize: 13, fontWeight: strong ? 600 : 400,
          color: tone === "red" ? C.red : tone === "green" ? C.green : C.ink,
        }}
      >
        {value}
      </span>
    </div>
  );
}

/* ------------------------------------------------------------------ intake */
const PARSE_PROMPT = `You are reading a signed accessibility services contract for AccessibilityChecker.org.
Extract the commercial terms. Respond with ONLY a JSON object, no preamble, no markdown fences:
{
 "client": "legal name of the client",
 "contractDate": "YYYY-MM-DD or empty string",
 "services": {"remediation": bool, "audit": bool, "vpat": bool, "pdf": bool, "monitoring": bool},
 "projectFee": number (total one-time fee, 0 if none),
 "depositPct": number (percent due upfront, usually 50),
 "monitoringMonthly": number (0 if no monitoring),
 "monitoringMonths": number (contracted term in months, 12 if unstated),
 "scopeNotes": "one short line: page/template count, platform, anything unusual",
 "confidence": "high" | "medium" | "low",
 "flags": ["anything ambiguous a human should check"]
}
Rules: remediation, audit, vpat and pdf are one-time work; "pdf" means remediating PDF documents for accessibility. Monitoring is the only recurring service and it starts only after the one-time work is handed over. "audit" is true when a standalone manual audit is sold. When remediation is sold, an audit is normally part of it, so set remediation true and audit false unless the audit is priced separately. Numbers must be plain numbers with no currency symbols.`;

const NOTE_PROMPT = `You are reading an internal note from AccessibilityChecker.org describing work that was sold to a client. There may be no formal contract, so do not expect signatures, payment clauses or legal terms, and never flag their absence.
Pull out whatever commercial detail is there and leave the rest empty. Respond with ONLY a JSON object, no preamble, no markdown fences:
{
 "client": "client name if named, else empty string",
 "contractDate": "YYYY-MM-DD or empty string",
 "services": {"remediation": bool, "audit": bool, "vpat": bool, "pdf": bool, "monitoring": bool},
 "projectFee": number (0 if not stated),
 "depositPct": number (50 unless stated otherwise),
 "monitoringMonthly": number (0 if none),
 "monitoringMonths": number (12 if unstated),
 "scopeNotes": "one short line: page or template count, platform, anything unusual",
 "confidence": "high" | "medium" | "low",
 "flags": ["only things that change what we charge or what we owe someone, max 2, empty array if none"]
}
Shorthand is normal here: "7 tops" or "7tops" means 7 templates, "wcag aa" is the standard target. Interpret it, do not complain about it.`;

function Intake({ settings, onCreate }) {
  const [mode, setMode] = useState("contract"); // contract | note
  const PROMPT = mode === "contract" ? PARSE_PROMPT : NOTE_PROMPT;
  const [stage, setStage] = useState("idle"); // idle | parsing | review
  const [err, setErr] = useState("");
  const [pasted, setPasted] = useState("");
  const [draft, setDraft] = useState(null);
  const [meta, setMeta] = useState(null);
  const fileRef = useRef(null);

  async function parseOnServer(file, text) {
    const fd = new FormData();
    fd.append("mode", mode);
    if (file) fd.append("file", file);
    if (text) fd.append("text", text);
    const res = await fetch("/api/parse", { method: "POST", body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Parsing failed");
    return data;
  }

  function applyParsed(parsed) {
    setDraft(
      newProject({
        client: parsed.client || "",
        contractDate: parsed.contractDate || today(),
        services: { remediation: false, audit: false, vpat: false, pdf: false, monitoring: false, ...(parsed.services || {}) },
        projectFee: num(parsed.projectFee),
        depositPct: num(parsed.depositPct) || 50,
        monitoringMonthly: num(parsed.monitoringMonthly),
        monitoringMonths: num(parsed.monitoringMonths) || 12,
        notes: parsed.scopeNotes || "",
      })
    );
    setMeta({ confidence: parsed.confidence, flags: parsed.flags || [] });
    setStage("review");
  }

  async function handleFile(file) {
    if (!file) return;
    setErr("");
    setStage("parsing");
    try {
      applyParsed(await parseOnServer(file, null));
    } catch (e) {
      setErr(e.message);
      setStage("idle");
    }
  }

  async function handlePaste() {
    if (!pasted.trim()) return;
    setErr("");
    setStage("parsing");
    try {
      applyParsed(await parseOnServer(null, pasted));
    } catch (e) {
      setErr(e.message);
      setStage("idle");
    }
  }

  if (stage === "review" && draft) {
    const set = (patch) => setDraft({ ...draft, ...patch });
    return (
      <div className="grid gap-4" style={{ maxWidth: 780 }}>
        <Panel
          title="What the contract says"
          right={<Chip tone={meta?.confidence === "high" ? "green" : "amber"}>{meta?.confidence || "?"} confidence</Chip>}
        >
          <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <Field label="Client">
              <TextIn value={draft.client} onChange={(e) => set({ client: e.target.value })} />
            </Field>
            <Field label="Contract date">
              <TextIn type="date" value={draft.contractDate} onChange={(e) => set({ contractDate: e.target.value })} />
            </Field>
          </div>

          <div className="flex flex-wrap gap-2 mt-4">
            {Object.keys(SERVICE_LABELS).map((k) => (
              <button
                key={k}
                onClick={() => set({ services: { ...draft.services, [k]: !draft.services[k] } })}
                style={{
                  fontFamily: SANS, fontSize: 12.5, padding: "6px 11px", borderRadius: 3, cursor: "pointer",
                  background: draft.services[k] ? C.ink : C.panel,
                  color: draft.services[k] ? "#fff" : C.ink2,
                  border: `1px solid ${draft.services[k] ? C.ink : C.rule}`,
                }}
              >
                {SERVICE_LABELS[k]}
              </button>
            ))}
          </div>

          <div className="grid gap-3 mt-4" style={{ gridTemplateColumns: "1fr 1fr 1fr" }}>
            <Field label="One-time fee">
              <NumIn value={draft.projectFee} onChange={(e) => set({ projectFee: e.target.value })} />
            </Field>
            <Field label="Upfront %">
              <NumIn value={draft.depositPct} onChange={(e) => set({ depositPct: e.target.value })} />
            </Field>
            <Field label="Monitoring / mo">
              <NumIn value={draft.monitoringMonthly} onChange={(e) => set({ monitoringMonthly: e.target.value })} />
            </Field>
          </div>

          {meta?.flags?.length > 0 && (
            <ul className="mt-4" style={{ fontSize: 12, color: C.amber, background: C.amberSoft, padding: "9px 12px", borderRadius: 3 }}>
              {meta.flags.map((f, i) => (
                <li key={i}>Check: {f}</li>
              ))}
            </ul>
          )}
        </Panel>

        <Panel title="Two questions before this becomes a project">
          <p style={{ fontSize: 13, color: C.ink2, marginBottom: 12 }}>
            How did we get this lead, and does anyone get paid for it?
          </p>
          <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
            <Field label="Lead source" hint="Nolan Klein, organic, partner, inbound, outbound">
              <TextIn
                value={draft.lead.source}
                placeholder="e.g. Nolan Klein referral"
                onChange={(e) => set({ lead: { ...draft.lead, source: e.target.value } })}
              />
            </Field>
            <Field label="Fee owed to" hint="Leave empty if nobody gets paid">
              <TextIn
                value={draft.lead.partner}
                placeholder="e.g. Nolan Klein"
                onChange={(e) => set({ lead: { ...draft.lead, partner: e.target.value } })}
              />
            </Field>
            <Field label="Fee type">
              <select
                value={draft.lead.feeType}
                onChange={(e) => set({ lead: { ...draft.lead, feeType: e.target.value } })}
                style={inputStyle}
              >
                <option value="pct">Percent of fee</option>
                <option value="fixed">Fixed amount</option>
              </select>
            </Field>
            <Field label={draft.lead.feeType === "pct" ? "Percent" : "Amount"}>
              <NumIn
                value={draft.lead.feeValue}
                onChange={(e) => set({ lead: { ...draft.lead, feeValue: e.target.value } })}
              />
            </Field>
          </div>
        </Panel>

        <div className="flex gap-2">
          <Btn kind="primary" onClick={() => { onCreate(draft); setStage("idle"); setDraft(null); setPasted(""); }}>
            Open the project
          </Btn>
          <Btn onClick={() => { setStage("idle"); setDraft(null); }}>Discard</Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="grid gap-4" style={{ maxWidth: 640 }}>
      <div className="flex gap-1" style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4, padding: 4 }}>
        {[["contract", "Signed contract"], ["note", "No contract, just describe it"]].map(([k, label]) => (
          <button
            key={k}
            onClick={() => setMode(k)}
            style={{
              flex: 1, fontFamily: SANS, fontSize: 12.5, padding: "7px 10px", borderRadius: 3,
              cursor: "pointer", border: "none",
              background: mode === k ? C.ink : "transparent",
              color: mode === k ? "#fff" : C.ink2,
              fontWeight: mode === k ? 600 : 400,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <Panel title={mode === "contract" ? "Signed contract" : "Scope document or notes"}>
        <div
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}
          style={{
            border: `1px dashed ${C.rule}`, borderRadius: 4, padding: "34px 20px",
            textAlign: "center", background: C.bg,
          }}
        >
          {stage === "parsing" ? (
            <p style={{ fontFamily: MONO, fontSize: 12, color: C.ink2 }}>Reading the contract...</p>
          ) : (
            <>
              <p style={{ fontSize: 13.5, color: C.ink, marginBottom: 4 }}>
                {mode === "contract" ? "Drop the signed PDF here" : "Drop the scope or proposal here"}
              </p>
              <p style={{ fontSize: 12, color: C.ink3, marginBottom: 12 }}>
                PDF, DOCX, image or plain text
              </p>
              <input
                ref={fileRef}
                type="file"
                accept=".pdf,.docx,.txt,.md,image/*"
                onChange={(e) => handleFile(e.target.files[0])}
                style={{ display: "none" }}
              />
              <Btn kind="primary" onClick={() => fileRef.current?.click()}>Choose a file</Btn>
            </>
          )}
        </div>
        {err && <p style={{ fontSize: 12, color: C.red, marginTop: 10 }}>{err}</p>}
      </Panel>

      <Panel title={mode === "contract" ? "Or paste the terms" : "Or type what we sold"}>
        <textarea
          rows={5}
          value={pasted}
          onChange={(e) => setPasted(e.target.value)}
          placeholder={
            mode === "contract"
              ? "Paste the service order or the scope and pricing section"
              : "e.g. Manual audit for Acme, 7 templates, WCAG 2.2 AA, $3,500, 50/50, no monitoring"
          }
          style={{ ...inputStyle, resize: "vertical" }}
        />
        <div className="mt-2">
          <Btn onClick={handlePaste} disabled={stage === "parsing"}>Read this</Btn>
        </div>
      </Panel>

      <Panel title="Nothing signed yet">
        <div className="flex items-center justify-between gap-4">
          <p style={{ fontSize: 12.5, color: C.ink2 }}>Set the project up by hand and fill the numbers in later.</p>
          <Btn onClick={() => { setDraft(newProject()); setMeta(null); setStage("review"); }}>Blank project</Btn>
        </div>
      </Panel>
    </div>
  );
}

/* ------------------------------------------------------------------ detail */
function Detail({ p, settings, onChange, onDelete, onBack }) {
  const n = pnl(p, settings);
  const cur = settings.currency;
  const set = (patch) => onChange({ ...p, ...patch });
  const [entry, setEntry] = useState({ date: today(), hours: "", note: "" });
  const [mEntry, setMEntry] = useState({ month: thisMonth(), hours: "", note: "" });

  const devName = (settings.team.find((t) => t.id === "dev") || {}).name || "Developer";

  async function findInvoices() {
    setLookup("Searching Gmail...");
    try {
      const r = await api(`/api/projects/${p.id}/find-invoices`, { method: "POST" });
      set({
        deposit: { ...p.deposit, ...Object.fromEntries(Object.entries(r.deposit || {}).filter(([, v]) => v)) },
        balance: { ...p.balance, ...Object.fromEntries(Object.entries(r.balance || {}).filter(([, v]) => v)) },

      setLookup(r.note || "Updated from Gmail.");

  return (
    <div className="grid gap-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-3">

          <input
            value={p.client}

          />
        </div>
        <div className="flex items-center gap-2">
          <select
            value={p.status}

              set(patch);

            <option value="delivered">Delivered</option>

          </select>
          <Btn kind="danger" onClick={onDelete}>Delete</Btn>
        </div>
      </div>

      <div className="grid gap-4" style={{ gridTemplateColumns: "minmax(0,1.15fr) minmax(0,1fr)" }}>
        <div className="grid gap-4">
          <Panel title="One-time P&L" right={<Chip tone="slate">{ONE_TIME.filter((k) => p.services[k]).map((k) => SHORT[k]).join(" + ") || "nothing sold"}</Chip>}>

              <Row label="Contract value" value={money(n.fee, cur)} strong />

          </Panel>

          <Panel title="Contract">
            <div className="grid gap-3">
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="One-time fee">
                  <NumIn value={p.projectFee} onChange={(e) => set({ projectFee: e.target.value })} />
                </Field>
                <Field label="Upfront %">
                  <NumIn value={p.depositPct} onChange={(e) => set({ depositPct: e.target.value })} />
                </Field>

              <div className="flex flex-wrap gap-2">
                {Object.keys(SERVICE_LABELS).map((k) => (
                  <button
                    key={k}
                    onClick={() => set({ services: { ...p.services, [k]: !p.services[k] } })}
                    style={{
                      fontFamily: SANS, fontSize: 12, padding: "5px 9px", borderRadius: 3, cursor: "pointer",
                      background: p.services[k] ? C.ink : C.panel,
                      color: p.services[k] ? "#fff" : C.ink3,
                      border: `1px solid ${p.services[k] ? C.ink : C.rule}`,
                    }}
                  >
                    {SERVICE_LABELS[k]}
                  </button>
                ))}
              </div>
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="Contract date">
                  <TextIn type="date" value={p.contractDate} onChange={(e) => set({ contractDate: e.target.value })} />
                </Field>
                <Field label="Handover date" hint="starts monitoring">
                  <TextIn type="date" value={p.deliveredAt} onChange={(e) => set({ deliveredAt: e.target.value })} />
                </Field>
              </div>
              <Field label="Lead source">
                <TextIn value={p.lead.source} onChange={(e) => set({ lead: { ...p.lead, source: e.target.value } })} />
              </Field>
              <div className="grid gap-3" style={{ gridTemplateColumns: "1.2fr .8fr" }}>
                <Field label="Referral to">
                  <TextIn value={p.lead.partner} onChange={(e) => set({ lead: { ...p.lead, partner: e.target.value } })} />
                </Field>
                <Field label={p.lead.feeType === "pct" ? "Percent" : "Amount"}>
                  <NumIn value={p.lead.feeValue} onChange={(e) => set({ lead: { ...p.lead, feeValue: e.target.value } })} />
                </Field>
              </div>
              <label className="flex items-center gap-2" style={{ fontSize: 12.5, color: C.ink2 }}>
                <input type="checkbox" checked={p.lead.feePaid} onChange={(e) => set({ lead: { ...p.lead, feePaid: e.target.checked } })} />
                Referral fee paid out
              </label>
              <Field label="Notes">
                <textarea rows={3} value={p.notes} onChange={(e) => set({ notes: e.target.value })} style={{ ...inputStyle, resize: "vertical" }} />
              </Field>
            </div>
          </Panel>
        </div>
      </div>
    </div>
  );
}

/* --------------------------------------------------------------- monthly */
function MonthlyTab({ months, settings }) {
  const cur = settings.currency;
  if (months.length === 0) {
    return (
      <Panel>
        <p style={{ fontSize: 13, color: C.ink3, textAlign: "center", padding: 20 }}>
          Nothing to report yet. A one-time project lands in the month it is handed over, monitoring lands in each month you log.
        </p>
      </Panel>
    );
  }
  const peak = Math.max(...months.map((m) => Math.max(m.rev, 1)));
  const sum = months.reduce(
    (a, m) => ({ oneRev: a.oneRev + m.oneRev, oneMargin: a.oneMargin + m.oneMargin, monRev: a.monRev + m.monRev, monMargin: a.monMargin + m.monMargin }),
    { oneRev: 0, oneMargin: 0, monRev: 0, monMargin: 0 }
  );

  return (
    <div className="grid gap-4">
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))" }}>
        {[
          ["One-time revenue", sum.oneRev, C.slate],
          ["One-time margin", sum.oneMargin, sum.oneMargin < 0 ? C.red : C.green],
          ["Monitoring revenue", sum.monRev, C.slate],

/* ------------------------------------------------------------ payments tab */
function PaymentsTab({ projects, settings, setSettings, onOpen, onPatch }) {
  const cur = settings.currency;
  const [status, setStatus] = useState("");
  const [matches, setMatches] = useState([]);

  const openItems = projects.flatMap((p) => {
    const n = pnl(p, settings);
    const rows = [];
    if (!p.deposit.paidAt && n.deposit > 0) rows.push({ p, stage: "deposit", label: "Deposit", amt: n.deposit, inv: p.deposit });
    if (!p.balance.paidAt && n.balance > 0) rows.push({ p, stage: "balance", label: "Balance", amt: n.balance, inv: p.balance });
    return rows;
  });

  async function reconcile() {
    if (openItems.length === 0) { setStatus("Nothing outstanding to match."); return; }
    setStatus("Checking Stripe and Mercury...");
    try {
      const r = await api("/api/reconcile", { method: "POST" });
      setMatches(r.matches || []);
      setStatus(r.note || `${r.paymentsSeen} payments seen, ${(r.matches || []).length} possible matches.`);
      setSettings({ ...settings, lastReconcile: today() });
    } catch (e) {
      setStatus(`Stripe / Mercury: ${e.message}`);
    }
  }

  function confirm(m) {
    const name = (m.client || "").toLowerCase();
    if (m.stage === "monitoring") {
      const proj = projects.find((x) => (x.client || "").toLowerCase() === name);
      if (!proj) return;
      const month = (m.date || today()).slice(0, 7);
      const log = proj.monitoringLog || [];
      const next = log.some((e) => e.month === month)
        ? log.map((e) => (e.month === month ? { ...e, paidAt: m.date } : e))
        : [...log, { month, hours: "", note: "", paidAt: m.date }];
      onPatch({ ...proj, monitoringLog: next });
      setMatches(matches.filter((x) => x !== m));
      return;
    }
    const row = openItems.find((r) => (r.p.client || "").toLowerCase() === name && r.stage === m.stage);
    if (!row) return;
    onPatch({ ...row.p, [m.stage]: { ...row.inv, paidAt: m.date } });
    setMatches(matches.filter((x) => x !== m));
  }

  const since = settings.lastReconcile ? daysBetween(settings.lastReconcile, today()) : null;

  return (
    <div className="grid gap-4">
      <Panel
        title="Money owed to us"
        right={<Btn kind="primary" onClick={reconcile}>Check Stripe and Mercury</Btn>}
        pad={false}
      >
        <div style={{ padding: "10px 14px", borderBottom: `1px solid ${C.rule}` }}>
          <p style={{ fontSize: 12.5, color: status ? C.ink : C.ink3 }}>
            {status || (since === null
              ? "Never reconciled. Run it to pull payments from Stripe and the bank."
              : since >= 7
              ? `Last checked ${since} days ago. Worth running again.`
              : `Last checked ${since} days ago.`)}
          </p>
        </div>
        {openItems.length === 0 ? (
          <p style={{ padding: 26, fontSize: 13, color: C.ink3, textAlign: "center" }}>Everything invoiced has been paid.</p>
        ) : (
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".08em", textTransform: "uppercase", color: C.ink3 }}>
                {["Client", "Stage", "Amount", "Invoice", "Due", "Overdue"].map((h, i) => (
                  <th key={h} style={{ textAlign: i === 2 || i === 5 ? "right" : "left", padding: "8px 14px", borderBottom: `1px solid ${C.rule}`, fontWeight: 400 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {openItems.map((r) => {
                const od = overdueBy(r.inv, settings);
                return (
                  <tr key={r.p.id + r.stage} onClick={() => onOpen(r.p.id)} style={{ cursor: "pointer", borderBottom: `1px solid ${C.rule}` }}>
                    <td style={{ padding: "10px 14px", fontSize: 13.5 }}>{r.p.client || "Untitled"}</td>
                    <td style={{ padding: "10px 14px" }}><Chip tone={r.stage === "balance" ? "amber" : "slate"}>{r.label}</Chip></td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13 }}>{money(r.amt, cur)}</td>
                    <td style={{ padding: "10px 14px", fontFamily: MONO, fontSize: 12, color: C.ink2 }}>{r.inv.invoiceNo || "not invoiced"}</td>
                    <td style={{ padding: "10px 14px", fontFamily: MONO, fontSize: 12, color: C.ink2 }}>{dueDate(r.inv, settings) || "-"}</td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 12.5, color: od > 0 ? C.red : C.ink2 }}>
                      {od === null ? "-" : od > 0 ? `${od}d` : "on time"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </Panel>

      {matches.length > 0 && (
        <Panel title="Payments that look like a match">
          <p style={{ fontSize: 12.5, color: C.ink2, marginBottom: 12 }}>
            Nothing is marked paid until you say so.
          </p>
          {matches.map((m, i) => (
            <div key={i} className="flex items-center justify-between gap-3" style={{ padding: "9px 0", borderBottom: `1px solid ${C.rule}` }}>
              <div>
                <span style={{ fontSize: 13.5, fontWeight: 600 }}>{m.client}</span>
                <span style={{ fontSize: 12.5, color: C.ink2 }}> &middot; {m.stage} &middot; {m.reference}</span>
                <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 2 }}>
                  {m.source} &middot; {m.date} &middot; {money(m.amount, cur)}
                </div>
              </div>
              <div className="flex items-center gap-2">
                <Chip tone={m.certainty === "high" ? "green" : "amber"}>{m.certainty}</Chip>
                <Btn kind="good" onClick={() => confirm(m)}>Mark paid</Btn>
                <Btn onClick={() => setMatches(matches.filter((x) => x !== m))}>Ignore</Btn>
              </div>
            </div>
          ))}
        </Panel>
      )}
    </div>
  );
}

/* ------------------------------------------------------------- timesheets */
function weeklyEmail(member, projects, settings) {
  const open = projects.filter((p) => p.status === "active" || p.status === "delivered");
  const list = open.map((p) => `- ${p.client || "Untitled"}`).join("\n");
  const week = today();

  if (member.id === "dev") {
    return {
      subject: `Hours this week, ${week}`,
      body: `Hi ${member.name},\n\nQuick one for the ledger. How many hours did you put into each of these this week?\n\n${list}\n\nJust reply with the project and the number of hours, nothing formal. If you touched something not on the list, add it.\n\nThanks`,
    };
  }
  if (member.id === "auditor") {
    return {
      subject: `Audit and VPAT costs, ${week}`,
      body: `Hi ${member.name},\n\nFor the P&L I need your project cost on the manual audit and the VPAT for these:\n\n${list}\n\nOne number per project per deliverable is enough. Also tell me which ones are finished so I know when to invoice the balance.\n\nThanks`,
    };
  }
  return {
    subject: `Project status, ${week}`,
    body: `Hi ${member.name},\n\nWeekly check on the open manual services projects:\n\n${list}\n\nFor each one: where is it, is anything blocked, and is it ready for handover? If a project is done, say so and I will trigger the balance invoice.\n\nThanks`,
  };
}

function TimesheetTab({ projects, settings, setSettings }) {
  const [status, setStatus] = useState("");
  const [preview, setPreview] = useState(null);

  async function draft(member) {
    setStatus(`Creating a draft for ${member.name}...`);
    try {
      await api("/api/team/draft", { method: "POST", body: JSON.stringify({ memberId: member.id }) });
      setStatus(`Draft ready in Gmail for ${member.name}. Review it and hit send.`);
      setSettings({ ...settings, lastTimesheetRun: today() });
    } catch (e) {
      setStatus(`Gmail: ${e.message}`);
    }
  }

  const stale = settings.lastTimesheetRun ? daysBetween(settings.lastTimesheetRun, today()) : null;

  return (
    <div className="grid gap-4" style={{ maxWidth: 780 }}>
      <Panel title="Weekly check-in">
        <p style={{ fontSize: 13, color: C.ink2 }}>
          {stale === null
            ? "No check-in sent yet."
            : stale >= 7
            ? `Last check-in was ${stale} days ago. Time to run it again.`
            : `Last check-in was ${stale} days ago.`}
        </p>
        <p style={{ fontSize: 12, color: C.ink3, marginTop: 6 }}>
          Drafts land in your Gmail. You press send, so nothing goes out that you have not read.
        </p>
        {status && <p style={{ fontSize: 12.5, color: C.green, marginTop: 10 }}>{status}</p>}
      </Panel>

      {settings.team.map((m, i) => {
        const mail = weeklyEmail(m, projects, settings);
        return (
          <Panel key={m.id} title={m.role}>
            <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1.4fr" }}>
              <Field label="Name">
                <TextIn
                  value={m.name}
                  onChange={(e) => setSettings({ ...settings, team: settings.team.map((x, j) => (j === i ? { ...x, name: e.target.value } : x)) })}
                />
              </Field>
              <Field label="Email">
                <TextIn
                  value={m.email}
                  placeholder="name@accessibilitychecker.org"
                  onChange={(e) => setSettings({ ...settings, team: settings.team.map((x, j) => (j === i ? { ...x, email: e.target.value } : x)) })}
                />
              </Field>
            </div>
            <div className="flex gap-2 mt-3">
              <Btn kind="primary" onClick={() => draft(m)}>Draft this week's email</Btn>
              <Btn onClick={() => setPreview(preview === m.id ? null : m.id)}>
                {preview === m.id ? "Hide" : "Preview"}
              </Btn>
            </div>
            {preview === m.id && (
              <pre
                style={{
                  marginTop: 12, background: C.bg, padding: 12, borderRadius: 3,
                  fontFamily: SANS, fontSize: 12.5, color: C.ink2, whiteSpace: "pre-wrap",
                }}
              >
                {mail.subject}
                {"\n\n"}
                {mail.body}
              </pre>
            )}
          </Panel>
        );
      })}
    </div>
  );
}

/* ------------------------------------------------------------------ app */
function App() {
  const [tab, setTab] = useState("projects");
  const [projects, setProjects] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [selected, setSelected] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveNote, setSaveNote] = useState("");

  const [gmailConnected, setGmailConnected] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const s = await api("/api/state");
        setProjects(s.projects);
        setSettings(s.settings);
        setGmailConnected(s.gmailConnected);
      } catch (e) {
        setSaveNote(e.message);
      }
      setLoaded(true);
    })();
  }, []);

  /* settings save whenever they change */
  useEffect(() => {
    if (!loaded) return;
    api("/api/settings", { method: "PUT", body: JSON.stringify(settings) })
      .then(() => setSaveNote("Saved " + new Date().toLocaleTimeString()))
      .catch((e) => setSaveNote("Not saved: " + e.message));
  }, [settings, loaded]);

  const totals = useMemo(() => {
    return projects.reduce(
      (a, p) => {
        const n = pnl(p, settings);
        a.fee += n.fee;
        a.cost += n.cost;
        a.margin += n.margin;
        a.outstanding += n.outstanding;
        a.monMargin += n.mMargin;
        if (p.status !== "closed") {
          a.mrr += n.mrr;
          a.pendingMrr += n.pendingMrr;
        }
        return a;
      },
      { fee: 0, cost: 0, margin: 0, outstanding: 0, mrr: 0, pendingMrr: 0, monMargin: 0 }
    );
  }, [projects, settings]);

  const months = useMemo(() => monthlyPnl(projects, settings), [projects, settings]);

  const tasks = useMemo(
    () => projects.flatMap((p) => tasksFor(p, settings)),
    [projects, settings]
  );

  const cur = settings.currency;
  const sel = projects.find((p) => p.id === selected);

  const upsert = (proj) => {
    setProjects((ps) => ps.map((x) => (x.id === proj.id ? proj : x)));
    clearTimeout(upsert.t?.[proj.id]);
    upsert.t = upsert.t || {};
    upsert.t[proj.id] = setTimeout(() => {
      api(`/api/projects/${proj.id}`, { method: "PUT", body: JSON.stringify(proj) })
        .then(() => setSaveNote("Saved " + new Date().toLocaleTimeString()))
        .catch((e) => setSaveNote("Not saved: " + e.message));
    }, 400);
  };
  const create = async (p) => {
    await api(`/api/projects/${p.id}`, { method: "PUT", body: JSON.stringify(p) });
    setProjects((ps) => [p, ...ps]);
  };
  const remove = async (id) => {
    await api(`/api/projects/${id}`, { method: "DELETE" });
    setProjects((ps) => ps.filter((x) => x.id !== id));
  };

  const TABS = [
    ["projects", "Projects"],
    ["monthly", "Monthly P&L"],
    ["intake", "New project"],
    ["payments", "Payments"],
    ["reminders", `Reminders${tasks.length ? ` (${tasks.length})` : ""}`],
    ["team", "Team check-in"],
    ["settings", "Rates"],
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: SANS, color: C.ink }}>
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "22px 20px 60px" }}>
        <header className="flex items-end justify-between flex-wrap gap-3" style={{ marginBottom: 18 }}>
          <div>
            <h1 style={{ fontSize: 20, fontWeight: 650, letterSpacing: "-.01em" }}>
              {"Manual Services Ledger & P&L"}
            </h1>
            <p style={{ fontFamily: MONO, fontSize: 11, color: C.ink3, marginTop: 3 }}>
              AccessibilityChecker.org &middot; what we sold, what it cost, who still owes us
            </p>
          </div>
          <div className="flex items-center gap-3">
            {!gmailConnected && (
              <a href="/auth/google" style={{ fontSize: 12, color: C.red, textDecoration: "none", border: `1px solid ${C.rule}`, padding: "5px 9px", borderRadius: 3, background: C.panel }}>
                Connect Gmail
              </a>
            )}
            <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.ink3 }}>{saveNote}</span>
          </div>
        </header>

        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", marginBottom: 18 }}>
          {[
            ["One-time booked", money(totals.fee, cur), C.ink],
            ["One-time margin", money(totals.margin, cur), totals.margin < 0 ? C.red : C.green],
            ["Monitoring margin", money(totals.monMargin, cur), totals.monMargin < 0 ? C.red : C.green],
            ["Live MRR", money(totals.mrr, cur), C.green],
            ["MRR not started", money(totals.pendingMrr, cur), C.ink3],
            ["Unpaid", money(totals.outstanding, cur), totals.outstanding > 0 ? C.red : C.ink2],
          ].map(([label, value, color]) => (
            <div key={label} style={{ background: C.panel, border: `1px solid ${C.rule}`, borderRadius: 4, padding: "11px 13px" }}>
              <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".1em", textTransform: "uppercase", color: C.ink3 }}>{label}</div>
              <div style={{ fontFamily: MONO, fontSize: 19, marginTop: 5, color }}>{value}</div>
            </div>
          ))}
        </div>

        <nav className="flex gap-1 flex-wrap" style={{ borderBottom: `1px solid ${C.rule}`, marginBottom: 18 }}>
          {TABS.map(([k, label]) => (
            <button
              key={k}
              onClick={() => { setTab(k); if (k !== "projects") setSelected(null); }}
              style={{
                fontFamily: SANS, fontSize: 13, padding: "8px 13px", cursor: "pointer",
                background: "transparent", border: "none",
                borderBottom: `2px solid ${tab === k ? C.ink : "transparent"}`,
                color: tab === k ? C.ink : C.ink3,
                fontWeight: tab === k ? 600 : 400,
              }}
            >
              {label}
            </button>
          ))}
        </nav>

        {tab === "intake" && (
          <Intake
            settings={settings}
            onCreate={async (p) => { await create(p); setSelected(p.id); setTab("projects"); }}
          />
        )}

        {tab === "projects" && (sel ? (
          <Detail
            p={sel}
            settings={settings}
            onChange={upsert}
            onBack={() => setSelected(null)}
            onDelete={async () => { await remove(sel.id); setSelected(null); }}
          />
        ) : (
          <Panel title={`${projects.length} project${projects.length === 1 ? "" : "s"}`} pad={false}
            right={<Btn onClick={() => setTab("intake")}>Add a contract</Btn>}>
            {projects.length === 0 ? (
              <p style={{ padding: 26, fontSize: 13, color: C.ink3, textAlign: "center" }}>
                Upload a signed contract to start the first project.
              </p>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: ".08em", textTransform: "uppercase", color: C.ink3 }}>
                    {["Client", "Sold", "One-time fee", "One-time margin", "Monitoring", "Unpaid", "Status"].map((h, i) => (
                      <th key={h} style={{ textAlign: i > 1 && i < 6 ? "right" : "left", padding: "8px 14px", borderBottom: `1px solid ${C.rule}`, fontWeight: 400 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {projects.map((p) => {
                    const n = pnl(p, settings);
                    return (
                      <tr key={p.id} onClick={() => setSelected(p.id)} style={{ cursor: "pointer", borderBottom: `1px solid ${C.rule}` }}>
                        <td style={{ padding: "10px 14px", fontSize: 13.5, fontWeight: 500 }}>{p.client || "Untitled"}</td>
                        <td style={{ padding: "10px 14px" }}>
                          <span className="flex gap-1 flex-wrap">
                            {Object.keys(SERVICE_LABELS).filter((k) => p.services[k]).map((k) => (
                              <Chip key={k} tone={k === "monitoring" ? (n.state === "running" ? "green" : "amber") : "slate"}>{SHORT[k]}</Chip>
                            ))}
                          </span>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13 }}>{money(n.fee, cur)}</td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13, color: n.margin < 0 ? C.red : C.green }}>
                          {money(n.margin, cur)} <span style={{ color: C.ink3 }}>{n.marginPct.toFixed(0)}%</span>
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13, color: C.ink2 }}>
                          {!p.services.monitoring ? <span style={{ color: C.ink3 }}>none</span>
                            : n.state === "pending" ? <span style={{ color: C.amber }}>{money(n.mFee, cur)}/mo pending</span>
                            : `${money(n.mFee, cur)}/mo`}
                        </td>
                        <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: MONO, fontSize: 13, color: n.outstanding > 0 ? C.red : C.ink3 }}>{money(n.outstanding, cur)}</td>
                        <td style={{ padding: "10px 14px" }}>
                          <Chip tone={p.status === "delivered" ? "amber" : p.status === "closed" ? "slate" : "green"}>{p.status}</Chip>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </Panel>
        ))}

        {tab === "monthly" && <MonthlyTab months={months} settings={settings} />}

        {tab === "payments" && (
          <PaymentsTab
            projects={projects}
            settings={settings}
            setSettings={setSettings}
            onOpen={(id) => { setSelected(id); setTab("projects"); }}
            onPatch={upsert}
          />
        )}
        {tab === "reminders" && (
          <div className="grid gap-3" style={{ maxWidth: 820 }}>
            {(!settings.lastTimesheetRun || daysBetween(settings.lastTimesheetRun, today()) >= 7) && (
              <div
                onClick={() => setTab("team")}
                style={{ background: C.panel, border: `1px solid ${C.rule}`, borderLeft: `3px solid ${C.slate}`, borderRadius: 4, padding: "12px 15px", cursor: "pointer" }}
              >
                <span style={{ fontSize: 13.5, fontWeight: 600 }}>Weekly check-in is due</span>
                <p style={{ fontSize: 12.5, color: C.ink2, marginTop: 5 }}>
                  Ask the team for hours and costs on the open projects. Drafts get created in Gmail for you to send.
                </p>
              </div>
            )}
            {(!settings.lastReconcile || daysBetween(settings.lastReconcile, today()) >= 7) && (
              <div
                onClick={() => setTab("payments")}
                style={{ background: C.panel, border: `1px solid ${C.rule}`, borderLeft: `3px solid ${C.green}`, borderRadius: 4, padding: "12px 15px", cursor: "pointer" }}
              >
                <span style={{ fontSize: 13.5, fontWeight: 600 }}>Reconcile payments</span>
                <p style={{ fontSize: 12.5, color: C.ink2, marginTop: 5 }}>
                  Pull the last 60 days of incoming payments from Stripe and Mercury and match them to open invoices.
                </p>
              </div>
            )}
            {tasks.length === 0 ? (
              <Panel><p style={{ fontSize: 13, color: C.ink3, textAlign: "center", padding: 14 }}>Nothing needs chasing.</p></Panel>
            ) : (
              tasks.map((t) => (
                <div
                  key={t.key}
                  onClick={() => { setSelected(t.project.id); setTab("projects"); }}
                  style={{
                    background: C.panel, border: `1px solid ${C.rule}`, borderLeft: `3px solid ${
                      t.level === "red" ? C.red : t.level === "amber" ? C.amber : t.level === "green" ? C.green : C.slate
                    }`, borderRadius: 4, padding: "12px 15px", cursor: "pointer",
                  }}
                >
                  <div className="flex items-center justify-between gap-3">
                    <span style={{ fontSize: 13.5, fontWeight: 600 }}>{t.title}</span>
                    <span style={{ fontFamily: MONO, fontSize: 11, color: C.ink3 }}>{t.project.client || "Untitled"}</span>
                  </div>
                  <p style={{ fontSize: 12.5, color: C.ink2, marginTop: 5 }}>{t.detail}</p>
                </div>
              ))
            )}
          </div>
        )}

        {tab === "team" && (
          <TimesheetTab projects={projects} settings={settings} setSettings={setSettings} />
        )}

        {tab === "settings" && (
          <div className="grid gap-4" style={{ maxWidth: 560 }}>
            <Panel title="Rates">
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="Developer, per hour"><NumIn value={settings.rateDev} onChange={(e) => setSettings({ ...settings, rateDev: e.target.value })} /></Field>
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10 }}>
                Audit and VPAT are priced per project, so Ritvik's quote goes on the project itself. Placeholder dev rate, change it before you trust a margin.
              </p>
            </Panel>
            <Panel title="Overhead applied to every project">
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="Project management %"><NumIn value={settings.pmPct} onChange={(e) => setSettings({ ...settings, pmPct: e.target.value })} /></Field>
                <Field label="Sales %"><NumIn value={settings.salesPct} onChange={(e) => setSettings({ ...settings, salesPct: e.target.value })} /></Field>
              </div>
              <p style={{ fontSize: 12, color: C.ink3, marginTop: 10 }}>
                Charged as a percent of the contract value, not of margin.
              </p>
            </Panel>
            <Panel title="Terms">
              <div className="grid gap-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
                <Field label="Currency"><TextIn value={settings.currency} onChange={(e) => setSettings({ ...settings, currency: e.target.value })} /></Field>
                <Field label="Payment terms, days" hint="Invoices flag red past this"><NumIn value={settings.termsDays} onChange={(e) => setSettings({ ...settings, termsDays: e.target.value })} /></Field>
              </div>
            </Panel>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
