<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual Services Ledger</title>
<style>body{margin:0;font-family:ui-sans-serif,system-ui;background:#EFF2F1;color:#131C19;display:grid;place-items:center;min-height:100vh}form{background:#fff;border:1px solid #DCE3E0;border-radius:4px;padding:28px;width:300px}h1{font-size:15px;margin:0 0 14px}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #DCE3E0;border-radius:3px;font-size:14px;margin-bottom:10px}button{width:100%;padding:9px;background:#131C19;color:#fff;border:0;border-radius:3px;font-size:13px;cursor:pointer}p{font-size:12px;color:#A93520;min-height:16px;margin:8px 0 0}</style></head>
<body><form id="f"><h1>Manual Services Ledger &amp; P&amp;L</h1><input id="p" type="password" placeholder="Password" autofocus><button>Sign in</button><p id="e"></p></form>
<script>document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});if(r.ok)location.href='/';else document.getElementById('e').textContent='Wrong password'};</script></body></html>
